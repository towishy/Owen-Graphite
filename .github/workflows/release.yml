name: Release

# Trigger when you push a tag matching the manifest version (e.g., 1.4.1)
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify manifest version matches tag
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          TAG_VERSION="${GITHUB_REF_NAME}"
          echo "Manifest version: $MANIFEST_VERSION"
          echo "Tag version:      $TAG_VERSION"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::manifest.json version ($MANIFEST_VERSION) does not match git tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Validate theme package
        run: python scripts/validate_theme.py --ci

      - name: Build manual install ZIP
        run: python scripts/build_release.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            theme.css
            manifest.json
            README.md
            CHANGELOG.md
            LICENSE
            snippets/zz-obsidian-gray-force-override-v2.css
            dist/Owen-Graphite-*.zip
