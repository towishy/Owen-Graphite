name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Brace balance check
        run: |
          python -c "
          s = open('theme.css').read()
          o, c = s.count('{'), s.count('}')
          print(f'Open: {o}  Close: {c}')
          assert o == c, f'Brace imbalance: {o} open vs {c} close'
          "

      - name: Manifest JSON parse
        run: python -c "import json; json.load(open('manifest.json'))"

      - name: Run theme validation
        run: |
          python dev/scripts/bundle_v3.py
          python dev/scripts/bundle_v3.py --check
          python -c "from pathlib import Path; theme = Path('theme.css').read_text(encoding='utf-8'); bundle = Path('dist/theme-v3.css').read_text(encoding='utf-8'); assert theme == bundle, 'theme.css is stale vs dist/theme-v3.css; promote the fresh bundle before commit'"
          python dev/scripts/audit_release_metadata.py
          python dev/scripts/audit_style_settings_contract.py
          python dev/scripts/audit_docs_assets.py
          python dev/scripts/audit_css_compat_budget.py
          python dev/scripts/audit_v3_hit_routing.py
          python dev/scripts/audit_pdf_header_footer.py
          python dev/scripts/v3_audit_duplicate_selectors.py --threshold 10
