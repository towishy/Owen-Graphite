name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Brace balance check
        run: |
          python -c "
          s = open('theme.css').read()
          o, c = s.count('{'), s.count('}')
          print(f'Open: {o}  Close: {c}')
          assert o == c, f'Brace imbalance: {o} open vs {c} close'
          "

      - name: Manifest JSON parse
        run: python -c "import json; json.load(open('manifest.json'))"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Source usage map freshness
        run: python dev/scripts/build_source_usage_map.py --check

      - name: Coverage priority plan freshness
        run: python dev/scripts/build_coverage_priority_plan.py --check

      - name: WIKI consistency
        run: python dev/scripts/audit_wiki_consistency.py

      - name: Core principles
        run: python dev/scripts/audit_core_principles.py

      - name: Release check
        run: python dev/scripts/release_check.py --skip-bundle
