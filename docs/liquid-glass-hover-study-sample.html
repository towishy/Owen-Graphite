<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liquid Glass Hover Study Sample</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #050505;
      --panel: rgba(255, 255, 255, 0.74);
      --panel-top: rgba(255, 255, 255, 0.92);
      --panel-bottom: rgba(250, 251, 253, 0.68);
      --rim: rgba(214, 220, 229, 0.82);
      --rim-blue: rgba(147, 197, 253, 0.55);
      --rim-mint: rgba(153, 246, 228, 0.42);
      --rim-warm: rgba(253, 230, 138, 0.46);
      --ink: #1f2937;
      --muted: #6b7280;
      --blue: #2563eb;
      --shadow: 0 14px 32px rgba(15, 23, 42, 0.18), 0 4px 10px rgba(15, 23, 42, 0.12);
      --shadow-hover: 0 20px 44px rgba(15, 23, 42, 0.22), 0 7px 18px rgba(15, 23, 42, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--canvas);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
    }

    .stage {
      width: min(1180px, calc(100vw - 48px));
      padding: 48px 56px 54px;
      border-radius: 6px;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.72), transparent 30%),
        linear-gradient(180deg, #ffffff, #fbfcfe 82%, #f8fafc);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
    }

    .caption {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin: 0 0 22px;
      color: #334155;
    }

    .caption h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .caption p {
      margin: 0;
      font-size: 14px;
      color: #64748b;
    }

    .toolbar-shell {
      position: relative;
      min-height: 214px;
      padding: 26px 18px;
      border: 1px solid rgba(226, 232, 240, 0.92);
      border-radius: 18px;
      background:
        radial-gradient(circle at 62% 18%, rgba(255, 255, 255, 0.82), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(248, 250, 252, 0.66));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.98), 0 18px 44px rgba(15, 23, 42, 0.16);
      overflow: visible;
    }

    .toolbar-shell::after {
      content: "";
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: -18px;
      height: 40px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.16);
      filter: blur(26px);
      opacity: 0.45;
      pointer-events: none;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid rgba(214, 220, 229, 0.74);
      border-radius: 18px;
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 255, 255, 0.76), transparent 28%),
        linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.96), inset 0 -1px 0 rgba(15, 23, 42, 0.06);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
    }

    .divider {
      width: 1px;
      height: 36px;
      margin: 0 6px;
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, rgba(148, 163, 184, 0.42), transparent);
    }

    .tool {
      position: relative;
      --tool-rgb: 148, 163, 184;
      --tool-rim-hover: rgba(148, 163, 184, 0.62);
      --tool-ink-hover: #1f2937;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(203, 213, 225, 0.74);
      border-radius: 9px;
      background:
        radial-gradient(circle at 68% 20%, rgba(255, 255, 255, 0.78), transparent 34%),
        radial-gradient(circle at 22% 78%, rgba(148, 163, 184, 0.08), transparent 42%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(248, 250, 252, 0.62));
      color: #334155;
      box-shadow: 0 5px 11px rgba(15, 23, 42, 0.10), 0 2px 5px rgba(15, 23, 42, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 0 rgba(15, 23, 42, 0.05);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease;
    }

    .tool svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      stroke-width: 2.1;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool[data-tone="sky"] {
      --tool-rgb: 96, 165, 250;
      --tool-rim-hover: rgba(59, 130, 246, 0.58);
      --tool-ink-hover: #1d4ed8;
    }

    .tool[data-tone="mint"] {
      --tool-rgb: 45, 212, 191;
      --tool-rim-hover: rgba(20, 184, 166, 0.54);
      --tool-ink-hover: #0f766e;
    }

    .tool[data-tone="warm"] {
      --tool-rgb: 251, 191, 36;
      --tool-rim-hover: rgba(245, 158, 11, 0.52);
      --tool-ink-hover: #92400e;
    }

    .tool[data-tone="violet"] {
      --tool-rgb: 167, 139, 250;
      --tool-rim-hover: rgba(139, 92, 246, 0.52);
      --tool-ink-hover: #5b21b6;
    }

    .tool[data-tone="rose"] {
      --tool-rgb: 251, 113, 133;
      --tool-rim-hover: rgba(244, 63, 94, 0.48);
      --tool-ink-hover: #be123c;
    }

    .tool[data-tone="emerald"] {
      --tool-rgb: 52, 211, 153;
      --tool-rim-hover: rgba(16, 185, 129, 0.52);
      --tool-ink-hover: #047857;
    }

    .tool:hover,
    .tool.is-hovered {
      transform: translateY(-4px) scale(1.03);
      border-color: var(--tool-rim-hover);
      background:
        radial-gradient(circle at 64% 18%, rgba(255, 255, 255, 0.95), transparent 38%),
        radial-gradient(circle at 22% 78%, rgba(var(--tool-rgb), 0.09), transparent 44%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.99), rgba(248, 250, 252, 0.78));
      color: var(--tool-ink-hover);
      box-shadow: var(--shadow-hover), 0 0 0 3px rgba(var(--tool-rgb), 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.99), inset 0 -1px 0 rgba(var(--tool-rgb), 0.07);
      z-index: 2;
    }

    .tool.is-hovered::after {
      content: "Open Markdown tools";
      position: absolute;
      left: 50%;
      top: calc(100% + 18px);
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 10px 15px 11px;
      border: 1px solid rgba(214, 220, 229, 0.78);
      border-radius: 9px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 250, 252, 0.88));
      color: #111827;
      font-weight: 650;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.98);
    }

    .subtools {
      display: flex;
      gap: 12px;
      margin: 22px 0 0 394px;
    }

    .subtools .tool {
      width: 50px;
      height: 50px;
      box-shadow: 0 6px 13px rgba(15, 23, 42, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.96);
    }

    .subtools .tool:hover,
    .subtools .tool.is-hovered {
      border-color: var(--tool-rim-hover);
    }

    .pointer {
      position: absolute;
      right: 268px;
      top: 72px;
      width: 102px;
      height: 102px;
      filter: drop-shadow(0 10px 12px rgba(15, 23, 42, 0.30));
      pointer-events: none;
      z-index: 4;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 28px;
    }

    .note {
      min-height: 70px;
      padding: 14px 16px;
      border: 1px solid rgba(214, 220, 229, 0.72);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.80), rgba(250, 251, 253, 0.54));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92), 0 4px 12px rgba(15, 23, 42, 0.07);
    }

    .note strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #334155;
    }

    .note span {
      font-size: 13px;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="caption" aria-label="sample title">
      <div>
        <h1>리퀴드 글래스 hover 샘플</h1>
        <p>흰 유리막, pastel rim, hover lift와 아래 그림자를 기준으로 재현</p>
      </div>
      <p>기본은 회색 유리, hover에서만 얕은 기능별 색상톤</p>
    </section>

    <section class="toolbar-shell" aria-label="liquid glass toolbar sample">
      <div class="toolbar">
        <button class="tool" data-tone="sky" aria-label="undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-1"/></svg></button>
        <button class="tool" data-tone="violet" aria-label="redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h1"/></svg></button>
        <button class="tool" data-tone="rose" aria-label="eraser"><svg viewBox="0 0 24 24"><path d="m7 21 10-10"/><path d="m21 15-6-6-8.5 8.5a3 3 0 0 0 4.2 4.2L13 19"/></svg></button>
        <span class="divider"></span>
        <button class="tool" data-tone="warm" aria-label="heading two"><strong>H₂</strong></button>
        <button class="tool" data-tone="emerald" aria-label="heading three"><strong>H₃</strong></button>
        <button class="tool" data-tone="sky" aria-label="pen"><svg viewBox="0 0 24 24"><path d="m16 3 5 5-9 9H7v-5z"/><path d="M7 17 4 20"/></svg></button>
        <button class="tool" data-tone="warm" aria-label="link"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.2l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.2l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"/></svg></button>
        <span class="divider"></span>
        <button class="tool" data-tone="mint" aria-label="table"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 16h16M10 4v16"/></svg></button>
        <button class="tool" data-tone="violet" aria-label="notebook"><svg viewBox="0 0 24 24"><path d="M8 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8z"/><path d="M5 6h3M5 10h3M5 14h3M5 18h3M11 9h5M11 13h5"/></svg></button>
        <button class="tool" data-tone="emerald" aria-label="tasks"><svg viewBox="0 0 24 24"><path d="m5 7 2 2 4-4M5 17l2 2 4-4M14 7h5M14 17h5"/></svg></button>
        <button class="tool" data-tone="sky" aria-label="columns"><svg viewBox="0 0 24 24"><path d="M5 5v14M10 7v10M15 4v16M20 8v8"/></svg></button>
        <span class="divider"></span>
        <button class="tool" data-tone="warm" aria-label="select"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" stroke-dasharray="3 3"/></svg></button>
        <button class="tool is-hovered" data-tone="sky" aria-label="open markdown tools"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.2l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.2l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"/></svg></button>
        <button class="tool" data-tone="warm" aria-label="align"><svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h16M4 17h10M17 9l3 3-3 3"/></svg></button>
        <button class="tool" data-tone="mint" aria-label="layout"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M10 5v14M4 11h16"/></svg></button>
        <button class="tool" data-tone="violet" aria-label="sparkle"><svg viewBox="0 0 24 24"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M17 7l-3 3M10 14l-3 3M7 7l3 3M14 14l3 3"/></svg></button>
        <button class="tool" data-tone="rose" aria-label="box"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="14" rx="2"/><path d="M9 9h6M9 13h6"/></svg></button>
      </div>

      <div class="subtools" aria-label="expanded sub tools">
        <button class="tool" data-tone="sky" aria-label="link"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.2l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.2l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"/></svg></button>
        <button class="tool" data-tone="violet" aria-label="pen"><svg viewBox="0 0 24 24"><path d="m16 3 5 5-9 9H7v-5z"/></svg></button>
        <button class="tool" data-tone="rose" aria-label="note"><svg viewBox="0 0 24 24"><path d="M8 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H8z"/><path d="M5 6h3M5 10h3M5 14h3M5 18h3"/></svg></button>
        <button class="tool" data-tone="mint" aria-label="table"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg></button>
        <button class="tool" data-tone="emerald" aria-label="columns"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M10 5v14"/></svg></button>
      </div>

      <svg class="pointer" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M40 10c-6 0-10 4-10 10v44L18 52a10 10 0 0 0-14 14l35 35c9 9 21 12 34 8l14-4c11-3 18-13 18-24V58c0-6-4-10-10-10-3 0-6 1-8 3-1-5-5-8-10-8-4 0-7 2-9 5-2-4-5-7-10-7-4 0-7 2-9 5V20c0-6-4-10-10-10z" fill="#fff" stroke="#111827" stroke-width="3"/>
        <path d="M50 20v42M68 51v17M87 58v16" stroke="#111827" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </section>

    <section class="legend" aria-label="observed rules">
      <div class="note"><strong>기본 색감</strong><span>평소에는 아이콘과 rim 모두 graphite/gray 계열로 유지하고, 유리막과 그림자만 남깁니다.</span></div>
      <div class="note"><strong>hover 변화</strong><span>마우스오버 시에만 sky/mint/warm/violet/rose tint가 얕게 올라오고 버튼이 살짝 떠오릅니다.</span></div>
      <div class="note"><strong>그림자</strong><span>hover 시 아래 방향 soft shadow가 커져 floating toolbar처럼 보이게 합니다.</span></div>
    </section>
  </main>
</body>
</html>
