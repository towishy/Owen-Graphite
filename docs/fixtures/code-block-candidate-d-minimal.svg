<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" width="1040" height="460"
     font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"
     text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <title>Owen Graphite — Code Block Candidate D · Minimal Outlined</title>
  <desc>Quietest variant. Fieldset-style cap-bar lang tag, near flat surface, ideal for print/PDF.</desc>

  <defs>
    <linearGradient id="surfLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/><stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="surfDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="bodyL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="bodyD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.66"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.50"/>
    </linearGradient>

    <filter id="hairShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="off" operator="over"/>
    </filter>

    <style>
      .lbl  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              font-size: 11px; letter-spacing: 0.10em; }
      .lblL { fill: #64748b; }   .lblD { fill: #94a3b8; }
      .head { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              font-size: 17px; font-weight: 650; letter-spacing: -0.005em; fill: #0f172a; }
      .sub  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              font-size: 12px; fill: #64748b; }

      .lang { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              font-size: 10px; letter-spacing: 0.06em; }

      .mono { font-size: 12.5px; }
      .kL { fill: #6d28d9; }     .kD { fill: #c4b5fd; }
      .sL { fill: #b45309; }     .sD { fill: #fcd34d; }
      .vL { fill: #0f766e; }     .vD { fill: #5eead4; }
      .cL { fill: #94a3b8; font-style: italic; }
      .cD { fill: #64748b; font-style: italic; }
      .txL { fill: #1f2937; }    .txD { fill: #e5e7eb; }
    </style>
  </defs>

  <rect width="1040" height="60" fill="#eef1f5"/>
  <text x="28" y="30" class="head">Candidate D · Minimal Outlined</text>
  <text x="28" y="48" class="sub">가장 가벼움 · 인쇄/PDF에 최적 · cap-bar 형태 lang 태그가 fieldset처럼 테두리에 걸침</text>

  <!-- LIGHT -->
  <g transform="translate(20,80)">
    <rect width="490" height="360" rx="14" fill="url(#surfLight)"/>
    <text x="14" y="22" class="lbl lblL">LIGHT</text>

    <g transform="translate(28,54)" filter="url(#hairShadow)">
      <rect y="6" width="434" height="284" rx="7" fill="url(#bodyL)" stroke="rgba(203,213,225,0.95)"/>
      <!-- cap bar with notch effect using a rect that breaks the top stroke -->
      <rect x="14" y="-2" width="56" height="16" rx="4" fill="#f1f5f9" stroke="rgba(203,213,225,0.95)"/>
      <text x="42" y="9" text-anchor="middle" class="lang" fill="#475569">PS1</text>

      <g class="mono" transform="translate(20,40)">
        <text y="0"><tspan class="cL"># 1. publisher 기반 deny rule 생성</tspan></text>
        <text y="22"><tspan class="vL">$DenyRules</tspan><tspan class="txL"> = </tspan><tspan class="vL">@</tspan><tspan class="txL">()</tspan></text>
        <text y="44"><tspan class="vL">$DenyRules</tspan><tspan class="txL"> += </tspan><tspan class="kL">New-CIPolicyRule</tspan><tspan class="txL"> `</tspan></text>
        <text y="66"><tspan class="txL">  </tspan><tspan class="kL">-Level</tspan><tspan class="txL"> FilePublisher `</tspan></text>
        <text y="88"><tspan class="txL">  </tspan><tspan class="kL">-DriverFilePath</tspan><tspan class="txL"> </tspan><tspan class="vL">$TargetBinary</tspan><tspan class="txL"> `</tspan></text>
        <text y="110"><tspan class="txL">  </tspan><tspan class="kL">-Fallback</tspan><tspan class="txL"> </tspan><tspan class="sL">"SignedVersion,Publisher,Hash"</tspan></text>
        <text y="132"><tspan class="txL">  </tspan><tspan class="kL">-Deny</tspan></text>
        <text y="166"><tspan class="cL"># 2. AllowAll template과 merge</tspan></text>
        <text y="188"><tspan class="kL">Merge-CIPolicy</tspan><tspan class="txL"> </tspan><tspan class="kL">-PolicyPaths</tspan><tspan class="txL"> </tspan><tspan class="vL">$AllowAllPolicy</tspan></text>
      </g>
    </g>
  </g>

  <!-- DARK -->
  <g transform="translate(530,80)">
    <rect width="490" height="360" rx="14" fill="url(#surfDark)"/>
    <text x="14" y="22" class="lbl lblD">DARK</text>

    <g transform="translate(28,54)" filter="url(#hairShadow)">
      <rect y="6" width="434" height="284" rx="7" fill="url(#bodyD)" stroke="rgba(71,85,105,0.7)"/>
      <rect x="14" y="-2" width="56" height="16" rx="4" fill="#1e293b" stroke="rgba(71,85,105,0.7)"/>
      <text x="42" y="9" text-anchor="middle" class="lang" fill="#cbd5e1">PS1</text>

      <g class="mono" transform="translate(20,40)">
        <text y="0"><tspan class="cD"># 1. publisher 기반 deny rule 생성</tspan></text>
        <text y="22"><tspan class="vD">$DenyRules</tspan><tspan class="txD"> = </tspan><tspan class="vD">@</tspan><tspan class="txD">()</tspan></text>
        <text y="44"><tspan class="vD">$DenyRules</tspan><tspan class="txD"> += </tspan><tspan class="kD">New-CIPolicyRule</tspan><tspan class="txD"> `</tspan></text>
        <text y="66"><tspan class="txD">  </tspan><tspan class="kD">-Level</tspan><tspan class="txD"> FilePublisher `</tspan></text>
        <text y="88"><tspan class="txD">  </tspan><tspan class="kD">-DriverFilePath</tspan><tspan class="txD"> </tspan><tspan class="vD">$TargetBinary</tspan><tspan class="txD"> `</tspan></text>
        <text y="110"><tspan class="txD">  </tspan><tspan class="kD">-Fallback</tspan><tspan class="txD"> </tspan><tspan class="sD">"SignedVersion,Publisher,Hash"</tspan></text>
        <text y="132"><tspan class="txD">  </tspan><tspan class="kD">-Deny</tspan></text>
        <text y="166"><tspan class="cD"># 2. AllowAll template과 merge</tspan></text>
        <text y="188"><tspan class="kD">Merge-CIPolicy</tspan><tspan class="txD"> </tspan><tspan class="kD">-PolicyPaths</tspan><tspan class="txD"> </tspan><tspan class="vD">$AllowAllPolicy</tspan></text>
      </g>
    </g>
  </g>
</svg>
