<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860" role="img" aria-labelledby="title desc">
  <title id="title">Owen Graphite Tab Design Proposal</title>
  <desc id="desc">Three quiet tab design proposals for Owen Graphite, showing inactive, active, hover, close, and plus states.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#edf4f8"/>
      <stop offset="1" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="barLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e9eff5"/>
    </linearGradient>
    <linearGradient id="barDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253244"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="activeSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#f0f9ff" stop-opacity="0.60"/>
    </linearGradient>
    <linearGradient id="activeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.50"/>
    </linearGradient>
    <filter id="sheetShadow" x="-16%" y="-28%" width="132%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="tabShadow" x="-18%" y="-30%" width="136%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: url(#pageBg); }
      .title { font: 750 32px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .panel { fill: rgba(255,255,255,0.68); stroke: rgba(203,213,225,0.70); stroke-width: 1; filter: url(#sheetShadow); }
      .panel-title { font: 720 19px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .panel-sub { font: 500 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .note { font: 650 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .label { font: 680 11px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0.04em; }
      .recommended { fill: rgba(240,253,250,0.94); stroke: rgba(20,184,166,0.40); stroke-width: 1; }
      .recommended-text { font: 720 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #0f766e; letter-spacing: 0.02em; }
      .toolbar-light { fill: url(#barLight); stroke: rgba(203,213,225,0.50); stroke-width: 1; }
      .toolbar-dark { fill: url(#barDark); stroke: rgba(100,116,139,0.34); stroke-width: 1; }
      .traffic-red { fill: #ff5f57; stroke: #e0443e; stroke-width: 1; }
      .traffic-yellow { fill: #ffbd2e; stroke: #dea123; stroke-width: 1; }
      .traffic-green { fill: #28c840; stroke: #1bad34; stroke-width: 1; }
      .inactive { fill: rgba(255,255,255,0.28); stroke: rgba(203,213,225,0.30); stroke-width: 1; }
      .inactive-dark { fill: rgba(15,23,42,0.24); stroke: rgba(148,163,184,0.18); stroke-width: 1; }
      .hover { fill: rgba(255,255,255,0.48); stroke: rgba(203,213,225,0.46); stroke-width: 1; }
      .hover-dark { fill: rgba(51,65,85,0.38); stroke: rgba(148,163,184,0.24); stroke-width: 1; }
      .active { fill: url(#activeSoft); stroke: rgba(125,211,252,0.72); stroke-width: 1.4; filter: url(#tabShadow); }
      .active-dark { fill: url(#activeDark); stroke: rgba(186,230,253,0.38); stroke-width: 1.4; }
      .active-flat { fill: rgba(255,255,255,0.72); stroke: rgba(125,211,252,0.60); stroke-width: 1.2; }
      .active-flat-dark { fill: rgba(51,65,85,0.52); stroke: rgba(186,230,253,0.30); stroke-width: 1.2; }
      .text-muted { font: 620 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .text-active { font: 800 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .text-dark { font: 620 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .text-dark-active { font: 800 20px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .x { stroke: #64748b; stroke-width: 2.4; stroke-linecap: round; }
      .x-dark { stroke: #cbd5e1; stroke-width: 2.4; stroke-linecap: round; }
      .plus { stroke: #64748b; stroke-width: 2.6; stroke-linecap: round; }
      .plus-dark { stroke: #cbd5e1; stroke-width: 2.6; stroke-linecap: round; }
      .rule { stroke: rgba(203,213,225,0.64); stroke-width: 1; }
      .rule-dark { stroke: rgba(100,116,139,0.42); stroke-width: 1; }
      .caption { font: 600 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1320" height="860"/>
  <text class="title" x="64" y="68">Tab Design Proposal</text>
  <text class="subtitle" x="64" y="98">Goal: tabs should read clearly without adding another row of glossy buttons.</text>

  <g transform="translate(64 138)">
    <rect class="panel" x="0" y="0" width="1192" height="188" rx="22"/>
    <text class="panel-title" x="28" y="38">A. Text-First Capsule</text>
    <text class="panel-sub" x="28" y="62">Inactive tabs are almost flat. Active tab uses a small aqua rim.</text>
    <text class="label" x="28" y="102">LIGHT</text>
    <rect class="toolbar-light" x="96" y="78" width="762" height="74" rx="14"/>
    <circle class="traffic-red" cx="124" cy="115" r="10"/>
    <circle class="traffic-yellow" cx="154" cy="115" r="10"/>
    <circle class="traffic-green" cx="184" cy="115" r="10"/>
    <rect class="inactive" x="230" y="91" width="276" height="48" rx="13"/>
    <text class="text-muted" x="246" y="123">mde-live-response-wsl-inven...</text>
    <rect class="active-flat" x="524" y="89" width="296" height="52" rx="13"/>
    <text class="text-active" x="540" y="123">WSL2 - 배포판 OS 정보 수...</text>
    <line class="x" x1="792" y1="107" x2="806" y2="121"/><line class="x" x1="806" y1="107" x2="792" y2="121"/>
    <line class="plus" x1="840" y1="113" x2="866" y2="113"/><line class="plus" x1="853" y1="100" x2="853" y2="126"/>
  </g>

  <g transform="translate(64 360)">
    <rect class="panel" x="0" y="0" width="1192" height="208" rx="22"/>
    <rect class="recommended" x="28" y="26" width="128" height="28" rx="14"/>
    <text class="recommended-text" x="44" y="45">RECOMMENDED</text>
    <text class="panel-title" x="176" y="38">B. Attached Soft Tab</text>
    <text class="panel-sub" x="176" y="62">Active tab is a calm attached sheet; inactive tabs stay muted and do not look like toolbar buttons.</text>
    <text class="label" x="28" y="112">LIGHT</text>
    <rect class="toolbar-light" x="96" y="88" width="762" height="82" rx="14"/>
    <circle class="traffic-red" cx="124" cy="129" r="10"/>
    <circle class="traffic-yellow" cx="154" cy="129" r="10"/>
    <circle class="traffic-green" cx="184" cy="129" r="10"/>
    <rect class="inactive" x="230" y="103" width="276" height="46" rx="12"/>
    <text class="text-muted" x="246" y="134">mde-live-response-wsl-inven...</text>
    <rect class="active" x="524" y="98" width="306" height="56" rx="14"/>
    <text class="text-active" x="542" y="134">WSL2 - 배포판 OS 정보 수...</text>
    <line class="x" x1="801" y1="116" x2="815" y2="130"/><line class="x" x1="815" y1="116" x2="801" y2="130"/>
    <line class="plus" x1="848" y1="126" x2="874" y2="126"/><line class="plus" x1="861" y1="113" x2="861" y2="139"/>
    <line class="rule" x1="96" y1="170" x2="858" y2="170"/>

    <text class="label" x="908" y="112">DARK</text>
    <rect class="toolbar-dark" x="964" y="88" width="188" height="82" rx="14"/>
    <rect class="active-dark" x="982" y="100" width="142" height="54" rx="14"/>
    <text class="text-dark-active" x="1000" y="134">Active</text>
    <line class="x-dark" x1="1096" y1="117" x2="1110" y2="131"/><line class="x-dark" x1="1110" y1="117" x2="1096" y2="131"/>
  </g>

  <g transform="translate(64 602)">
    <rect class="panel" x="0" y="0" width="1192" height="188" rx="22"/>
    <text class="panel-title" x="28" y="38">C. Understated Bar</text>
    <text class="panel-sub" x="28" y="62">Very minimal. Active is shown mainly by weight and a soft bottom connection.</text>
    <text class="label" x="28" y="102">LIGHT</text>
    <rect class="toolbar-light" x="96" y="78" width="762" height="74" rx="14"/>
    <circle class="traffic-red" cx="124" cy="115" r="10"/>
    <circle class="traffic-yellow" cx="154" cy="115" r="10"/>
    <circle class="traffic-green" cx="184" cy="115" r="10"/>
    <text class="text-muted" x="238" y="122">mde-live-response-wsl-inven...</text>
    <rect class="active-flat" x="516" y="91" width="312" height="48" rx="12" opacity="0.82"/>
    <text class="text-active" x="536" y="123">WSL2 - 배포판 OS 정보 수...</text>
    <line x1="536" y1="142" x2="795" y2="142" stroke="rgba(125,211,252,0.72)" stroke-width="3" stroke-linecap="round"/>
    <line class="x" x1="800" y1="107" x2="814" y2="121"/><line class="x" x1="814" y1="107" x2="800" y2="121"/>
    <line class="plus" x1="844" y1="114" x2="870" y2="114"/><line class="plus" x1="857" y1="101" x2="857" y2="127"/>
  </g>

  <text class="note" x="64" y="832">Recommendation: B keeps inactive tabs quiet, makes only the active tab feel like the current document, and avoids turning the tab bar into another toolbar.</text>
</svg>