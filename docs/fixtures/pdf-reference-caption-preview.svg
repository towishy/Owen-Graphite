<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Owen Graphite PDF References and Figure Caption Preview</title>
  <desc id="desc">Comparison of inline URL, clean reading, and reference-first PDF output with figure captions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.84"/><stop offset="1" stop-color="#f8fafc" stop-opacity="0.58"/></linearGradient>
    <linearGradient id="darkGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f2937" stop-opacity="0.88"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.76"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.15"/><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.10" stroke-width="1"/></pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill:#0f172a; font-size:42px; font-weight:830; }
      .sub { fill:#64748b; font-size:18px; font-weight:520; }
      .panelTitle { fill:#0f172a; font-size:19px; font-weight:820; }
      .label { fill:#64748b; font-size:13px; font-weight:780; }
      .paperTitle { fill:#0f172a; font-size:25px; font-weight:830; }
      .body { fill:#334155; font-size:12px; font-weight:520; }
      .muted { fill:#64748b; font-size:10px; font-weight:620; }
      .darkText { fill:#e5edf7; }
      .darkMuted { fill:#a8b5c7; }
    </style>
  </defs>
  <rect width="1440" height="920" fill="url(#bg)"/>
  <rect width="1440" height="920" fill="url(#grid)"/>
  <g class="sans">
    <text x="52" y="72" class="title">PDF References and Figure Caption Preview</text>
    <text x="52" y="106" class="sub">본문 URL 노출을 줄이고, 출처와 도표 설명을 문서 하단/캡션으로 정리하는 샘플</text>

    <g filter="url(#shadow)"><rect x="52" y="142" width="1336" height="404" rx="14" fill="url(#glass)" stroke="#cbd5e1"/></g>
    <text x="82" y="188" class="panelTitle">Light PDF Export</text>
    <g transform="translate(82 218)">
      <text x="0" y="0" class="label">Inline URL</text><text x="420" y="0" class="label">Clean Reading</text><text x="840" y="0" class="label">Reference First</text>
      <g transform="translate(0 22)"><rect width="380" height="260" rx="6" fill="#fff" stroke="#dbe3ee"/><text x="24" y="46" class="paperTitle">Export Quality Review</text><text x="24" y="78" class="body">긴 URL이 본문 뒤에 붙어 문단 흐름을 끊는다.</text><text x="24" y="104" class="muted">(https://example.com/research/obsidian-pdf-export-long-reference-id-2026)</text><rect x="24" y="132" width="332" height="78" rx="5" fill="#f8fafc" stroke="#dbe3ee"/><text x="24" y="238" class="body">도표 설명이 없어 의미를 따로 추론해야 한다.</text></g>
      <g transform="translate(420 22)"><rect width="380" height="260" rx="6" fill="#fff" stroke="#dbe3ee"/><text x="24" y="46" class="paperTitle">Export Quality Review</text><text x="24" y="78" class="body">본문은 짧게 유지하고 URL은 숨긴다.</text><rect x="24" y="108" width="332" height="78" rx="5" fill="#f8fafc" stroke="#dbe3ee"/><text x="24" y="208" class="muted">Figure 1. Compact Report 적용 후 정보 밀도 변화.</text></g>
      <g transform="translate(840 22)"><rect width="380" height="260" rx="6" fill="#fff" stroke="#dbe3ee"/><text x="24" y="46" class="paperTitle">Export Quality Review</text><text x="24" y="78" class="body">본문은 깨끗하게, 출처는 references에 모은다.</text><rect x="24" y="108" width="332" height="78" rx="5" fill="#f8fafc" stroke="#dbe3ee"/><text x="24" y="208" class="muted">Figure 1. Compact Report 적용 후 정보 밀도 변화.</text><line x1="24" y1="226" x2="356" y2="226" stroke="#dbe3ee"/><text x="24" y="246" class="muted">Web · Obsidian PDF Export Note · example.com/...</text></g>
    </g>

    <g filter="url(#shadow)"><rect x="52" y="590" width="1336" height="250" rx="14" fill="url(#darkGlass)" stroke="#334155"/></g>
    <text x="82" y="636" class="panelTitle darkText">Dark PDF Export</text>
    <g transform="translate(82 666)">
      <text x="0" y="0" class="label darkMuted">Inline URL</text><text x="420" y="0" class="label darkMuted">Clean Caption</text><text x="840" y="0" class="label darkMuted">Reference First</text>
      <g transform="translate(0 22)"><rect width="380" height="128" rx="6" fill="#111827" stroke="#334155"/><text x="24" y="44" class="paperTitle darkText">Source Density</text><text x="24" y="76" class="body darkMuted">긴 URL은 다크 PDF에서 회색 덩어리처럼 보인다.</text><text x="24" y="102" class="muted darkMuted">https://example.com/source/very-long-url-token</text></g>
      <g transform="translate(420 22)"><rect width="380" height="128" rx="6" fill="#111827" stroke="#334155"/><text x="24" y="44" class="paperTitle darkText">Source Density</text><rect x="24" y="62" width="332" height="36" rx="5" fill="#182234" stroke="#334155"/><text x="24" y="116" class="muted darkMuted">Figure 2. Caption은 작지만 충분한 대비를 유지한다.</text></g>
      <g transform="translate(840 22)"><rect width="380" height="128" rx="6" fill="#111827" stroke="#334155"/><text x="24" y="44" class="paperTitle darkText">Source Density</text><text x="24" y="76" class="body darkText">출처는 references 영역으로 모아 본문 리듬을 보존한다.</text><text x="24" y="104" class="muted darkMuted">Web · Source Density Example · example.com/source/...</text></g>
    </g>
  </g>
</svg>