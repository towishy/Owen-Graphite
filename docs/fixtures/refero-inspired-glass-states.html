<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owen Graphite Glass State Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --brand: #475569;
      --line: rgba(100, 116, 139, 0.28);
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.72);
      --surface: linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(248, 250, 252, 0.54));
      --surface-strong: radial-gradient(circle at 76% 24%, rgba(255, 255, 255, 0.72), transparent 36%), linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 252, 0.64));
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 52%, #f1f5f9 100%);
      color: #111827;
    }

    .wrap {
      display: grid;
      gap: 24px;
      padding: 28px;
    }

    .mode {
      display: grid;
      gap: 14px;
      max-width: 980px;
    }

    .mode.dark {
      --line: rgba(203, 213, 225, 0.20);
      --shadow: 0 18px 42px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.10);
      --surface: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.46));
      --surface-strong: radial-gradient(circle at 76% 24%, rgba(148, 163, 184, 0.16), transparent 36%), linear-gradient(180deg, rgba(51, 65, 85, 0.74), rgba(15, 23, 42, 0.54));
      background: linear-gradient(135deg, #111827 0%, #1e293b 60%, #0f172a 100%);
      color: #f8fafc;
    }

    .frame {
      display: grid;
      grid-template-columns: 64px minmax(220px, 280px) minmax(320px, 1fr);
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.24);
      box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      backdrop-filter: blur(16px) saturate(150%);
    }

    .dark .frame {
      background: rgba(15, 23, 42, 0.26);
    }

    .rail,
    .pane,
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42);
      -webkit-backdrop-filter: blur(12px) saturate(145%);
      backdrop-filter: blur(12px) saturate(145%);
    }

    .rail {
      display: grid;
      align-content: start;
      gap: 8px;
      padding: 8px;
    }

    .icon {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }

    .pane,
    .panel {
      padding: 10px;
    }

    .row {
      min-height: 34px;
      margin: 3px 0;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      box-sizing: border-box;
    }

    .row.hover {
      background: rgba(100, 116, 139, 0.08);
    }

    .row.active {
      border-color: var(--line);
      background: var(--surface-strong);
      box-shadow: inset 0 0 0 1px var(--line), 0 6px 16px rgba(15, 23, 42, 0.10);
      font-weight: 650;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .chip {
      min-height: 72px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.58);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="mode light" aria-label="Light preview">
      <div class="frame">
        <div class="rail"><div class="icon"></div><div class="icon"></div><div class="icon"></div></div>
        <div class="pane"><div class="row">default</div><div class="row hover">hover</div><div class="row active">active ring</div></div>
        <div class="panel"><div class="panel-grid"><div class="chip"></div><div class="chip"></div><div class="chip"></div></div></div>
      </div>
    </section>
    <section class="mode dark" aria-label="Dark preview">
      <div class="frame">
        <div class="rail"><div class="icon"></div><div class="icon"></div><div class="icon"></div></div>
        <div class="pane"><div class="row">default</div><div class="row hover">hover</div><div class="row active">active ring</div></div>
        <div class="panel"><div class="panel-grid"><div class="chip"></div><div class="chip"></div><div class="chip"></div></div></div>
      </div>
    </section>
  </main>
</body>
</html>
