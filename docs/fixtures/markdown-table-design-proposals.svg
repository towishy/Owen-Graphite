<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Owen Graphite Markdown Table Design Proposals</title>
  <desc id="desc">Four proposed default Markdown table designs for Owen Graphite, showing light and dark previews with table rows, headers, hover states, numeric cells, and source notes.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.48" stop-color="#edf3f8"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.54"/>
    </linearGradient>
    <linearGradient id="glassTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.90"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="glassHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="darkPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="darkTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="panelShadow" x="-12%" y="-16%" width="124%" height="136%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
    <filter id="tableShadow" x="-8%" y="-12%" width="116%" height="128%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 42px; font-weight: 830; letter-spacing: 0; }
      .subtitle { fill: #64748b; font-size: 18px; font-weight: 520; letter-spacing: 0; }
      .panel-title { fill: #0f172a; font-size: 21px; font-weight: 820; letter-spacing: 0; }
      .panel-copy { fill: #64748b; font-size: 13px; font-weight: 560; letter-spacing: 0; }
      .token-title { fill: #0f172a; font-size: 18px; font-weight: 830; }
      .token-copy { fill: #64748b; font-size: 12px; font-weight: 620; }
      .label { fill: #475569; font-size: 12px; font-weight: 800; letter-spacing: 0; }
      .th { fill: #334155; font-size: 13px; font-weight: 800; letter-spacing: 0; }
      .td { fill: #334155; font-size: 12px; font-weight: 560; letter-spacing: 0; }
      .muted { fill: #64748b; font-size: 10px; font-weight: 620; }
      .dark-title { fill: #f8fafc; }
      .dark-copy { fill: #a8b5c7; }
      .dark-text { fill: #e5edf7; }
      .dark-muted { fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1600" height="1160" fill="url(#pageBg)"/>
  <rect width="1600" height="1160" fill="url(#grid)"/>

  <g class="sans">
    <text x="64" y="74" class="title">Markdown Table Design Proposals</text>
    <text x="64" y="108" class="subtitle">기본 Markdown 표를 더 읽기 쉽고 고급스럽게 만드는 4가지 후보. 기본값은 편집성, PDF 안정성, 긴 셀 줄바꿈을 우선합니다.</text>

    <g filter="url(#panelShadow)">
      <rect x="64" y="140" width="338" height="86" rx="10" fill="url(#glassPanel)" stroke="#cbd5e1"/>
      <rect x="424" y="140" width="338" height="86" rx="10" fill="url(#glassPanel)" stroke="#cbd5e1"/>
      <rect x="784" y="140" width="338" height="86" rx="10" fill="url(#glassPanel)" stroke="#cbd5e1"/>
      <rect x="1144" y="140" width="338" height="86" rx="10" fill="url(#glassPanel)" stroke="#cbd5e1"/>
    </g>
    <text x="90" y="176" class="token-title">A. Crystal Ledger</text>
    <text x="90" y="203" class="token-copy">glass + shadow + 얇은 grid 후보</text>
    <text x="450" y="176" class="token-title">B. Report Sheet</text>
    <text x="450" y="203" class="token-copy">선택 기본안. 고대비 paper tone</text>
    <text x="810" y="176" class="token-title">C. Scan Zebra</text>
    <text x="810" y="203" class="token-copy">행 추적이 빠른 zebra + hover 강화</text>
    <text x="1170" y="176" class="token-title">D. Data Compact</text>
    <text x="1170" y="203" class="token-copy">숫자와 상태표에 맞춘 촘촘한 grid</text>

    <g transform="translate(64 266)">
      <g filter="url(#panelShadow)">
        <rect width="720" height="392" rx="14" fill="url(#glassPanel)" stroke="#cbd5e1"/>
      </g>
      <text x="30" y="44" class="panel-title">A. Crystal Ledger</text>
      <text x="30" y="70" class="panel-copy">기본 Markdown table 추천안. 반투명 표면, 차분한 shadow, 선명한 header, 은은한 hover.</text>
      <g transform="translate(30 102)" filter="url(#tableShadow)">
        <rect width="660" height="236" fill="url(#glassTable)" stroke="#cbd5e1"/>
        <rect width="660" height="46" fill="url(#glassHead)" stroke="#cbd5e1"/>
        <rect y="46" width="660" height="1" fill="#cbd5e1"/>
        <rect y="92" width="660" height="46" fill="#f8fafc" fill-opacity="0.62"/>
        <rect y="138" width="660" height="46" fill="#e0f2fe" fill-opacity="0.40"/>
        <rect y="184" width="660" height="1" fill="#e2e8f0"/>
        <line x1="182" y1="0" x2="182" y2="236" stroke="#e2e8f0"/>
        <line x1="390" y1="0" x2="390" y2="236" stroke="#e2e8f0"/>
        <line x1="530" y1="0" x2="530" y2="236" stroke="#e2e8f0"/>
        <text x="18" y="29" class="th">항목</text><text x="202" y="29" class="th">상태</text><text x="410" y="29" class="th">수치</text><text x="550" y="29" class="th">메모</text>
        <text x="18" y="76" class="td">문서 구조</text><text x="202" y="76" class="td">완료</text><text x="410" y="76" class="td">96%</text><text x="550" y="76" class="td">안정</text>
        <text x="18" y="122" class="td">표 가독성</text><text x="202" y="122" class="td">검토</text><text x="410" y="122" class="td">1.42</text><text x="550" y="122" class="td">줄간격</text>
        <text x="18" y="168" class="td">긴 셀</text><text x="202" y="168" class="td">wrap</text><text x="410" y="168" class="td">42ch</text><text x="550" y="168" class="td">hover</text>
        <text x="18" y="214" class="td">출처</text><text x="202" y="214" class="td">표 아래</text><text x="410" y="214" class="td">2개</text><text x="550" y="214" class="td">권장</text>
      </g>
      <text x="30" y="366" class="muted">후보: glass 감성은 좋지만 기본 표로는 B보다 선 대비가 약함.</text>
    </g>

    <g transform="translate(816 266)">
      <g filter="url(#panelShadow)">
        <rect width="720" height="392" rx="14" fill="url(#glassPanel)" stroke="#cbd5e1"/>
      </g>
      <text x="30" y="44" class="panel-title">B. Report Sheet</text>
      <text x="30" y="70" class="panel-copy">PDF 보고서에 맞춘 선명한 paper table. 여백은 낮추고 header 대비를 높임.</text>
      <g transform="translate(30 102)" filter="url(#tableShadow)">
        <rect width="660" height="236" rx="5" fill="#ffffff" stroke="#bcc9d8"/>
        <rect width="660" height="44" rx="5" fill="#eef2f7" stroke="#bcc9d8"/>
        <rect y="44" width="660" height="2" fill="#94a3b8"/>
        <rect y="90" width="660" height="1" fill="#dbe3ee"/>
        <rect y="136" width="660" height="1" fill="#dbe3ee"/>
        <rect y="182" width="660" height="1" fill="#dbe3ee"/>
        <line x1="180" y1="0" x2="180" y2="236" stroke="#dbe3ee"/>
        <line x1="410" y1="0" x2="410" y2="236" stroke="#dbe3ee"/>
        <line x1="536" y1="0" x2="536" y2="236" stroke="#dbe3ee"/>
        <text x="16" y="28" class="th">섹션</text><text x="198" y="28" class="th">판단</text><text x="428" y="28" class="th">점수</text><text x="554" y="28" class="th">결론</text>
        <text x="16" y="74" class="td">Executive</text><text x="198" y="74" class="td">첫 화면 결론 우선</text><text x="428" y="74" class="td">A</text><text x="554" y="74" class="td">유지</text>
        <text x="16" y="120" class="td">Evidence</text><text x="198" y="120" class="td">근거를 주장 아래 배치</text><text x="428" y="120" class="td">A-</text><text x="554" y="120" class="td">강화</text>
        <text x="16" y="166" class="td">Table</text><text x="198" y="166" class="td">셀 padding 축소 가능</text><text x="428" y="166" class="td">B+</text><text x="554" y="166" class="td">조정</text>
        <text x="16" y="212" class="td">Source</text><text x="198" y="212" class="td">표 밖 note 권장</text><text x="428" y="212" class="td">A</text><text x="554" y="212" class="td">명확</text>
      </g>
      <text x="30" y="366" class="muted">선택: 기본 Markdown table 적용안. 헤더 대비와 grid 가시성이 가장 안정적임.</text>
    </g>

    <g transform="translate(64 700)">
      <g filter="url(#panelShadow)">
        <rect width="720" height="392" rx="14" fill="url(#darkPanel)" stroke="#334155"/>
      </g>
      <text x="30" y="44" class="panel-title dark-title">C. Scan Zebra</text>
      <text x="30" y="70" class="panel-copy dark-copy">리스트형 Markdown 표를 빠르게 스캔하는 후보. 짝수행과 hover 상태를 더 분명히 함.</text>
      <g transform="translate(30 102)" filter="url(#tableShadow)">
        <rect width="660" height="236" rx="7" fill="url(#darkTable)" stroke="#475569"/>
        <rect width="660" height="46" rx="7" fill="#263548" stroke="#475569"/>
        <rect y="46" width="660" height="1" fill="#475569"/>
        <rect y="92" width="660" height="46" fill="#0f172a" fill-opacity="0.40"/>
        <rect y="138" width="660" height="46" fill="#164e63" fill-opacity="0.38"/>
        <rect x="18" y="149" width="102" height="24" rx="12" fill="#dbeafe" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.38"/>
        <line x1="182" y1="0" x2="182" y2="236" stroke="#334155"/>
        <line x1="390" y1="0" x2="390" y2="236" stroke="#334155"/>
        <line x1="530" y1="0" x2="530" y2="236" stroke="#334155"/>
        <text x="18" y="29" class="th dark-text">작업</text><text x="202" y="29" class="th dark-text">담당</text><text x="410" y="29" class="th dark-text">상태</text><text x="550" y="29" class="th dark-text">마감</text>
        <text x="18" y="76" class="td dark-text">샘플 검토</text><text x="202" y="76" class="td dark-copy">Design</text><text x="410" y="76" class="td dark-text">Ready</text><text x="550" y="76" class="td dark-copy">오늘</text>
        <text x="18" y="122" class="td dark-text">CSS 적용</text><text x="202" y="122" class="td dark-copy">Theme</text><text x="410" y="122" class="td dark-text">Next</text><text x="550" y="122" class="td dark-copy">승인 후</text>
        <text x="30" y="166" class="td dark-text">Hover row</text><text x="202" y="166" class="td dark-copy">QA</text><text x="410" y="166" class="td dark-text">Focus</text><text x="550" y="166" class="td dark-copy">확인</text>
        <text x="18" y="214" class="td dark-text">PDF smoke</text><text x="202" y="214" class="td dark-copy">Build</text><text x="410" y="214" class="td dark-text">Pending</text><text x="550" y="214" class="td dark-copy">릴리즈</text>
      </g>
      <text x="30" y="366" class="muted dark-muted">권장: task/log 표가 많은 vault에 적합. 일반 본문 표에는 hover가 조금 강할 수 있음.</text>
    </g>

    <g transform="translate(816 700)">
      <g filter="url(#panelShadow)">
        <rect width="720" height="392" rx="14" fill="url(#darkPanel)" stroke="#334155"/>
      </g>
      <text x="30" y="44" class="panel-title dark-title">D. Data Compact</text>
      <text x="30" y="70" class="panel-copy dark-copy">숫자, 상태, 비교값이 많은 표 후보. 더 촘촘한 grid와 tabular number 느낌.</text>
      <g transform="translate(30 102)" filter="url(#tableShadow)">
        <rect width="660" height="236" rx="5" fill="#111827" stroke="#475569"/>
        <rect width="660" height="40" rx="5" fill="#1f2937" stroke="#475569"/>
        <rect y="40" width="660" height="1" fill="#64748b"/>
        <rect y="78" width="660" height="1" fill="#334155"/>
        <rect y="116" width="660" height="1" fill="#334155"/>
        <rect y="154" width="660" height="1" fill="#334155"/>
        <rect y="192" width="660" height="1" fill="#334155"/>
        <line x1="168" y1="0" x2="168" y2="236" stroke="#334155"/>
        <line x1="340" y1="0" x2="340" y2="236" stroke="#334155"/>
        <line x1="496" y1="0" x2="496" y2="236" stroke="#334155"/>
        <text x="16" y="26" class="th dark-text">Metric</text><text x="188" y="26" class="th dark-text">Current</text><text x="362" y="26" class="th dark-text">Target</text><text x="520" y="26" class="th dark-text">Delta</text>
        <text x="16" y="64" class="td dark-copy">Rows / page</text><text x="242" y="64" class="td dark-text">28</text><text x="416" y="64" class="td dark-text">34</text><text x="548" y="64" class="td dark-text">+21%</text>
        <text x="16" y="102" class="td dark-copy">Cell padding</text><text x="242" y="102" class="td dark-text">0.58em</text><text x="416" y="102" class="td dark-text">0.44em</text><text x="548" y="102" class="td dark-text">-24%</text>
        <text x="16" y="140" class="td dark-copy">Line height</text><text x="242" y="140" class="td dark-text">1.42</text><text x="416" y="140" class="td dark-text">1.34</text><text x="548" y="140" class="td dark-text">-6%</text>
        <text x="16" y="178" class="td dark-copy">Contrast</text><text x="242" y="178" class="td dark-text">AA</text><text x="416" y="178" class="td dark-text">AA+</text><text x="548" y="178" class="td dark-text">OK</text>
        <text x="16" y="216" class="td dark-copy">Long token</text><text x="188" y="216" class="td dark-text">wrap-anywhere</text><text x="362" y="216" class="td dark-text">stable</text><text x="548" y="216" class="td dark-text">OK</text>
      </g>
      <text x="30" y="366" class="muted dark-muted">권장: numeric-table / compact-table 계열. 기본 Markdown table 전체에 적용하면 다소 빽빽함.</text>
    </g>

    <g transform="translate(64 1116)">
      <rect width="1472" height="2" rx="1" fill="url(#accentA)" opacity="0.48"/>
      <text x="0" y="28" class="muted">적용: 기본값은 B Report Sheet, 옵션/utility 성격의 task/log/numeric 표는 C와 D 방향을 보조 후보로 유지합니다.</text>
    </g>
  </g>
</svg>