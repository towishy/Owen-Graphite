<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Owen Graphite seven design improvements overview</title>
  <desc id="desc">Compact overview of seven proposed Owen Graphite Liquid Glass design improvements.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="0.52" stop-color="#eef6f8"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.96"/><stop offset="0.58" stop-color="#f8fafc" stop-opacity="0.78"/><stop offset="1" stop-color="#e2e8f0" stop-opacity="0.48"/></linearGradient>
    <linearGradient id="darkGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#334155" stop-opacity="0.88"/><stop offset="0.58" stop-color="#1e293b" stop-opacity="0.86"/><stop offset="1" stop-color="#0f172a" stop-opacity="0.90"/></linearGradient>
    <linearGradient id="hover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.68" stop-color="#f8fafc" stop-opacity="0.90"/><stop offset="1" stop-color="#e0f2fe" stop-opacity="0.58"/></linearGradient>
    <radialGradient id="shine" cx="78%" cy="16%" r="54%"><stop offset="0" stop-color="#fff" stop-opacity="0.90"/><stop offset="0.45" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-16%" y="-16%" width="132%" height="144%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.15"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/></filter>
    <filter id="darkShadow" x="-16%" y="-16%" width="132%" height="144%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.20"/></filter>
    <filter id="focus" x="-12%" y="-20%" width="124%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#67e8f9" flood-opacity="0.55"/><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font:800 48px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;letter-spacing:0}.sub{font:600 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569;letter-spacing:0}.h{font:800 25px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a;letter-spacing:0}.hd{fill:#e2e8f0}.p{font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b;letter-spacing:0}.pd{fill:#94a3b8}.small{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#334155;letter-spacing:0}.sd{fill:#cbd5e1}.n{font:900 23px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0369a1;letter-spacing:0}.nd{fill:#67e8f9}.mono{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#cbd5e1;letter-spacing:0}
    </style>
  </defs>
  <rect width="1400" height="940" fill="url(#bg)"/><circle cx="1180" cy="115" r="210" fill="#bae6fd" opacity="0.28"/><circle cx="140" cy="840" r="250" fill="#ddd6fe" opacity="0.25"/>
  <text x="66" y="82" class="title">Owen Graphite 디자인 개선 샘플 7</text><text x="68" y="118" class="sub">좌측 라인 없이 Glass + Shadow + Frost Aqua focus로 통일한 승인용 방향안</text>

  <g transform="translate(68 162)"><rect width="594" height="184" rx="18" fill="url(#glass)" stroke="#cbd5e1" filter="url(#shadow)"/><rect width="594" height="184" rx="18" fill="url(#shine)" opacity="0.58"/><text x="26" y="45" class="n">1</text><text x="62" y="45" class="h">사이드 패널 glass 정리</text><text x="62" y="74" class="p">Backlinks · Outline · Tags · Search를 조용한 graphite glass로 통일</text><rect x="54" y="104" width="170" height="46" rx="12" fill="#fff" fill-opacity="0.56" stroke="#cbd5e1"/><text x="80" y="133" class="small">Outline row</text><rect x="256" y="98" width="250" height="54" rx="13" fill="url(#hover)" stroke="#7dd3fc"/><text x="282" y="131" class="small">Active/hover without rail</text></g>
  <g transform="translate(738 162)"><rect width="594" height="184" rx="18" fill="url(#darkGlass)" stroke="#475569" filter="url(#darkShadow)"/><rect width="594" height="184" rx="18" fill="url(#shine)" opacity="0.16"/><text x="26" y="45" class="n nd">2</text><text x="62" y="45" class="h hd">hover는 색보다 물성 변화</text><text x="62" y="74" class="p pd">shine · rim · soft shadow · 1px lift 중심, 과한 blue fill 금지</text><rect x="74" y="106" width="130" height="48" rx="13" fill="#0f172a" fill-opacity="0.28" stroke="#64748b"/><text x="104" y="136" class="small sd">Default</text><rect x="244" y="96" width="150" height="58" rx="14" fill="#334155" fill-opacity="0.80" stroke="#67e8f9" filter="url(#darkShadow)"/><text x="292" y="132" class="small sd">Hover</text></g>
  <g transform="translate(68 396)"><rect width="388" height="188" rx="18" fill="url(#glass)" stroke="#cbd5e1" filter="url(#shadow)"/><text x="26" y="45" class="n">3</text><text x="62" y="45" class="h">Frost Aqua focus</text><text x="62" y="74" class="p">키보드 탐색 rim/halo 통일</text><rect x="54" y="102" width="276" height="34" rx="10" fill="#fff" fill-opacity="0.60" stroke="#cbd5e1"/><rect x="54" y="148" width="276" height="34" rx="10" fill="url(#hover)" stroke="#67e8f9" stroke-width="2" filter="url(#focus)"/></g>
  <g transform="translate(506 396)"><rect width="388" height="188" rx="18" fill="url(#darkGlass)" stroke="#475569" filter="url(#darkShadow)"/><text x="26" y="45" class="n nd">4</text><text x="62" y="45" class="h hd">Floating UI 통일</text><text x="62" y="74" class="p pd">Palette · menu · popover · tooltip</text><rect x="60" y="104" width="260" height="38" rx="11" fill="#e0f2fe" fill-opacity="0.12" stroke="#67e8f9" stroke-opacity="0.48"/><text x="84" y="128" class="small sd">Stable menu row height</text><rect x="60" y="151" width="206" height="24" rx="8" fill="#fff" fill-opacity="0.08" stroke="#64748b"/></g>
  <g transform="translate(944 396)"><rect width="388" height="188" rx="18" fill="url(#glass)" stroke="#cbd5e1" filter="url(#shadow)"/><text x="26" y="45" class="n">5</text><text x="62" y="45" class="h">탭/파일 active 상태</text><text x="62" y="74" class="p">full border · tint · weight로 현재 위치 표시</text><rect x="54" y="111" width="102" height="38" rx="11" fill="#fff" fill-opacity="0.55" stroke="#cbd5e1"/><text x="76" y="135" class="small">Draft</text><rect x="180" y="101" width="120" height="48" rx="12" fill="url(#hover)" stroke="#38bdf8" filter="url(#shadow)"/><text x="206" y="131" class="small">Active</text></g>
  <g transform="translate(68 640)"><rect width="594" height="198" rx="18" fill="url(#glass)" stroke="#cbd5e1" filter="url(#shadow)"/><text x="26" y="47" class="n">6</text><text x="62" y="47" class="h">본문 표/코드 rhythm 개선</text><text x="62" y="77" class="p">본문은 glass 과장보다 가독성 · wrapping · Live Preview 편집 안정성 우선</text><rect x="58" y="112" width="210" height="54" rx="12" fill="#fff" fill-opacity="0.62" stroke="#cbd5e1"/><line x1="58" y1="139" x2="268" y2="139" stroke="#cbd5e1"/><line x1="160" y1="112" x2="160" y2="166" stroke="#e2e8f0"/><rect x="322" y="107" width="206" height="66" rx="13" fill="#0f172a" fill-opacity="0.86" stroke="#334155"/><text x="346" y="147" class="mono">--ogd-glass-bg</text></g>
  <g transform="translate(738 640)"><rect width="594" height="198" rx="18" fill="url(#darkGlass)" stroke="#475569" filter="url(#darkShadow)"/><rect width="594" height="198" rx="18" fill="url(#shine)" opacity="0.14"/><text x="26" y="47" class="n nd">7</text><text x="62" y="47" class="h hd">모바일/overlay polish</text><text x="62" y="77" class="p pd">드로어 · 검색 · 설정 overlay는 겹침 방지와 touch target을 우선</text><rect x="64" y="110" width="130" height="56" rx="16" fill="#0f172a" fill-opacity="0.42" stroke="#64748b"/><rect x="86" y="128" width="86" height="9" rx="5" fill="#94a3b8"/><rect x="86" y="147" width="72" height="9" rx="5" fill="#67e8f9" fill-opacity="0.45"/><rect x="246" y="110" width="246" height="42" rx="13" fill="#67e8f9" fill-opacity="0.12" stroke="#67e8f9" stroke-opacity="0.44"/><text x="270" y="137" class="small sd">Readable touch target</text></g>
  <text x="68" y="898" class="p">검토 후 실제 적용은 영역별 fixture 분리 → dev CSS EOF 패치 → bundle/analyze/validate 순서로 진행</text>
</svg>