<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc">
  <title id="title">Owen Graphite Top Icon Design Proposal</title>
  <desc id="desc">Three quiet top icon design proposals with light and dark toolbar states.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#edf4f8"/>
      <stop offset="1" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="lightBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#edf4f8" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="darkBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263447" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="softHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0.54"/>
    </linearGradient>
    <linearGradient id="softHoverDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.48"/>
    </linearGradient>
    <filter id="sheetShadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="darkShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <symbol id="icon-folder" viewBox="0 0 32 32">
      <path d="M4.5 10.5h9l2.2 3h11.8v12H4.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M4.5 10.5v-3h8.2l2.1 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 32 32">
      <circle cx="14" cy="14" r="8.2" fill="none" stroke="currentColor" stroke-width="2.35"/>
      <path d="M20.2 20.2l6.1 6.1" fill="none" stroke="currentColor" stroke-width="2.35" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-bookmark" viewBox="0 0 32 32">
      <path d="M9 5.5h14v21l-7-4.2-7 4.2z" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-panel" viewBox="0 0 32 32">
      <rect x="6" y="5.5" width="20" height="21" rx="4" fill="none" stroke="currentColor" stroke-width="2.25"/>
      <rect x="10" y="9" width="5" height="14" rx="1.4" fill="none" stroke="currentColor" stroke-width="2.25"/>
    </symbol>
    <style>
      .bg { fill: url(#pageBg); }
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .panel-title { font: 700 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #111827; letter-spacing: 0; }
      .panel-sub { font: 500 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0; }
      .note { font: 600 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .label { font: 650 11px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 0.04em; }
      .proposal { fill: rgba(255,255,255,0.66); stroke: rgba(203,213,225,0.72); stroke-width: 1; filter: url(#sheetShadow); }
      .toolbar-light { fill: url(#lightBar); stroke: rgba(203,213,225,0.52); stroke-width: 1; }
      .toolbar-dark { fill: url(#darkBar); stroke: rgba(100,116,139,0.36); stroke-width: 1; }
      .traffic-red { fill: #ff5f57; stroke: #e0443e; stroke-width: 1; }
      .traffic-yellow { fill: #ffbd2e; stroke: #dea123; stroke-width: 1; }
      .traffic-green { fill: #28c840; stroke: #1bad34; stroke-width: 1; }
      .slot-icon { color: #1f2937; }
      .slot-icon-muted { color: #6b7280; }
      .slot-icon-active { color: #111827; }
      .slot-icon-dark { color: #cbd5e1; }
      .slot-icon-dark-active { color: #f8fafc; }
      .quiet-hover { fill: rgba(224,242,254,0.35); stroke: rgba(125,211,252,0.42); stroke-width: 1; }
      .quiet-active { fill: rgba(255,255,255,0.58); stroke: rgba(96,165,250,0.62); stroke-width: 1.2; }
      .quiet-hover-dark { fill: rgba(14,116,144,0.20); stroke: rgba(103,232,249,0.24); stroke-width: 1; }
      .quiet-active-dark { fill: rgba(51,65,85,0.48); stroke: rgba(186,230,253,0.34); stroke-width: 1.2; }
      .soft-tile { fill: url(#softHover); stroke: rgba(125,211,252,0.68); stroke-width: 1.2; filter: url(#softShadow); }
      .soft-tile-dark { fill: url(#softHoverDark); stroke: rgba(186,230,253,0.34); stroke-width: 1.2; filter: url(#darkShadow); }
      .icon-only-active { fill: rgba(14,165,233,0.11); stroke: transparent; }
      .icon-only-active-dark { fill: rgba(103,232,249,0.11); stroke: transparent; }
      .dot { fill: #38bdf8; }
      .dot-dark { fill: #67e8f9; }
      .recommended { fill: rgba(240,253,250,0.94); stroke: rgba(20,184,166,0.40); stroke-width: 1; }
      .recommended-text { font: 700 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; fill: #0f766e; letter-spacing: 0.02em; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="880"/>
  <text class="title" x="64" y="70">Top Icon Core Design Proposals</text>
  <text class="subtitle" x="64" y="98">Goal: simple toolbar, no stacked boxes, hover appears only when the pointer is on an icon.</text>

  <g transform="translate(64 136)">
    <rect class="proposal" x="0" y="0" width="1152" height="190" rx="22"/>
    <text class="panel-title" x="28" y="38">A. Quiet Rim</text>
    <text class="panel-sub" x="28" y="61">A thin side-pane style rim appears on hover and active states.</text>
    <text class="label" x="28" y="96">LIGHT</text>
    <rect class="toolbar-light" x="96" y="78" width="450" height="76" rx="14"/>
    <circle class="traffic-red" cx="124" cy="116" r="10"/>
    <circle class="traffic-yellow" cx="154" cy="116" r="10"/>
    <circle class="traffic-green" cx="184" cy="116" r="10"/>
    <rect class="quiet-active" x="230" y="92" width="56" height="48" rx="7"/>
    <rect class="quiet-hover" x="302" y="92" width="56" height="48" rx="7"/>
    <rect x="374" y="92" width="56" height="48" rx="7" fill="transparent"/>
    <rect class="quiet-hover" x="446" y="92" width="56" height="48" rx="7"/>
    <use href="#icon-folder" class="slot-icon-active" x="242" y="101" width="32" height="32"/>
    <use href="#icon-search" class="slot-icon-muted" x="314" y="101" width="32" height="32"/>
    <use href="#icon-bookmark" class="slot-icon-muted" x="386" y="101" width="32" height="32"/>
    <use href="#icon-panel" class="slot-icon-muted" x="458" y="101" width="32" height="32"/>

    <text class="label" x="622" y="96">DARK</text>
    <rect class="toolbar-dark" x="690" y="78" width="386" height="76" rx="14"/>
    <rect class="quiet-active-dark" x="724" y="92" width="56" height="48" rx="7"/>
    <rect class="quiet-hover-dark" x="796" y="92" width="56" height="48" rx="7"/>
    <rect x="868" y="92" width="56" height="48" rx="7" fill="transparent"/>
    <rect class="quiet-hover-dark" x="940" y="92" width="56" height="48" rx="7"/>
    <use href="#icon-folder" class="slot-icon-dark-active" x="736" y="101" width="32" height="32"/>
    <use href="#icon-search" class="slot-icon-dark" x="808" y="101" width="32" height="32"/>
    <use href="#icon-bookmark" class="slot-icon-dark" x="880" y="101" width="32" height="32"/>
    <use href="#icon-panel" class="slot-icon-dark" x="952" y="101" width="32" height="32"/>
  </g>

  <g transform="translate(64 360)">
    <rect class="proposal" x="0" y="0" width="1152" height="208" rx="22"/>
    <rect class="recommended" x="28" y="26" width="128" height="28" rx="14"/>
    <text class="recommended-text" x="44" y="45">RECOMMENDED</text>
    <text class="panel-title" x="176" y="38">B. Soft Glass Slot</text>
    <text class="panel-sub" x="176" y="61">Default icons stay bare; hover and active use one small glass surface with aqua rim.</text>
    <text class="label" x="28" y="108">LIGHT</text>
    <rect class="toolbar-light" x="96" y="88" width="450" height="76" rx="14"/>
    <circle class="traffic-red" cx="124" cy="126" r="10"/>
    <circle class="traffic-yellow" cx="154" cy="126" r="10"/>
    <circle class="traffic-green" cx="184" cy="126" r="10"/>
    <rect class="soft-tile" x="230" y="102" width="56" height="48" rx="8"/>
    <rect class="soft-tile" x="302" y="102" width="56" height="48" rx="8" opacity="0.72"/>
    <rect x="374" y="102" width="56" height="48" rx="8" fill="transparent"/>
    <rect x="446" y="102" width="56" height="48" rx="8" fill="transparent"/>
    <use href="#icon-folder" class="slot-icon-active" x="242" y="111" width="32" height="32"/>
    <use href="#icon-search" class="slot-icon-muted" x="314" y="111" width="32" height="32"/>
    <use href="#icon-bookmark" class="slot-icon-muted" x="386" y="111" width="32" height="32"/>
    <use href="#icon-panel" class="slot-icon-muted" x="458" y="111" width="32" height="32"/>

    <text class="label" x="622" y="108">DARK</text>
    <rect class="toolbar-dark" x="690" y="88" width="386" height="76" rx="14"/>
    <rect class="soft-tile-dark" x="724" y="102" width="56" height="48" rx="8"/>
    <rect class="soft-tile-dark" x="796" y="102" width="56" height="48" rx="8" opacity="0.76"/>
    <rect x="868" y="102" width="56" height="48" rx="8" fill="transparent"/>
    <rect x="940" y="102" width="56" height="48" rx="8" fill="transparent"/>
    <use href="#icon-folder" class="slot-icon-dark-active" x="736" y="111" width="32" height="32"/>
    <use href="#icon-search" class="slot-icon-dark" x="808" y="111" width="32" height="32"/>
    <use href="#icon-bookmark" class="slot-icon-dark" x="880" y="111" width="32" height="32"/>
    <use href="#icon-panel" class="slot-icon-dark" x="952" y="111" width="32" height="32"/>
  </g>

  <g transform="translate(64 602)">
    <rect class="proposal" x="0" y="0" width="1152" height="190" rx="22"/>
    <text class="panel-title" x="28" y="38">C. Icon Only</text>
    <text class="panel-sub" x="28" y="61">The cleanest option: color and a small dot indicate active state; hover is nearly invisible.</text>
    <text class="label" x="28" y="96">LIGHT</text>
    <rect class="toolbar-light" x="96" y="78" width="450" height="76" rx="14"/>
    <circle class="traffic-red" cx="124" cy="116" r="10"/>
    <circle class="traffic-yellow" cx="154" cy="116" r="10"/>
    <circle class="traffic-green" cx="184" cy="116" r="10"/>
    <rect class="icon-only-active" x="230" y="92" width="56" height="48" rx="8"/>
    <circle class="dot" cx="258" cy="145" r="2.8"/>
    <use href="#icon-folder" class="slot-icon-active" x="242" y="101" width="32" height="32"/>
    <use href="#icon-search" class="slot-icon-muted" x="314" y="101" width="32" height="32"/>
    <use href="#icon-bookmark" class="slot-icon-muted" x="386" y="101" width="32" height="32"/>
    <use href="#icon-panel" class="slot-icon-muted" x="458" y="101" width="32" height="32"/>

    <text class="label" x="622" y="96">DARK</text>
    <rect class="toolbar-dark" x="690" y="78" width="386" height="76" rx="14"/>
    <rect class="icon-only-active-dark" x="724" y="92" width="56" height="48" rx="8"/>
    <circle class="dot-dark" cx="752" cy="145" r="2.8"/>
    <use href="#icon-folder" class="slot-icon-dark-active" x="736" y="101" width="32" height="32"/>
    <use href="#icon-search" class="slot-icon-dark" x="808" y="101" width="32" height="32"/>
    <use href="#icon-bookmark" class="slot-icon-dark" x="880" y="101" width="32" height="32"/>
    <use href="#icon-panel" class="slot-icon-dark" x="952" y="101" width="32" height="32"/>
  </g>

  <text class="note" x="64" y="836">Recommendation: B keeps the toolbar quiet at rest, but still feels tactile on hover. A is flatter; C is the most minimal but gives weaker affordance.</text>
</svg>