<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Owen Graphite PDF Compact Report Preview</title>
  <desc id="desc">PDF export baseline rhythm and compact rhythm comparison in light and dark modes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="darkGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="paperShadow" x="-18%" y="-18%" width="136%" height="144%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #0f172a; font-size: 44px; font-weight: 820; letter-spacing: 0; }
      .subtitle { fill: #64748b; font-size: 19px; font-weight: 520; letter-spacing: 0; }
      .panelTitle { fill: #0f172a; font-size: 19px; font-weight: 800; }
      .panelNote { fill: #64748b; font-size: 13px; font-weight: 560; }
      .label { fill: #64748b; font-size: 13px; font-weight: 760; }
      .darkLabel { fill: #cbd5e1; }
      .paperTitle { fill: #0f172a; font-size: 30px; font-weight: 830; letter-spacing: 0; }
      .paperH { fill: #0f172a; font-size: 15px; font-weight: 780; }
      .body { fill: #334155; font-size: 12px; font-weight: 520; }
      .muted { fill: #64748b; font-size: 10px; font-weight: 620; }
      .darkText { fill: #e5edf7; }
      .darkMuted { fill: #a8b5c7; }
      .chip { fill: #475569; font-size: 11px; font-weight: 820; }
      .metricValue { fill: #0f172a; font-size: 24px; font-weight: 850; }
      .metricLabel { fill: #64748b; font-size: 12px; font-weight: 620; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="url(#bg)"/>
  <rect width="1440" height="980" fill="url(#grid)"/>

  <g class="sans">
    <text x="52" y="72" class="title">PDF Compact Report Preview</text>
    <text x="52" y="106" class="subtitle">기존 리듬보다 공백을 줄이고, 본문 대비와 표 밀도를 높이는 PDF export 샘플</text>

    <g filter="url(#softShadow)">
      <rect x="52" y="138" width="250" height="82" rx="10" fill="url(#glass)" stroke="#cbd5e1"/>
      <rect x="318" y="138" width="250" height="82" rx="10" fill="url(#glass)" stroke="#cbd5e1"/>
      <rect x="584" y="138" width="250" height="82" rx="10" fill="url(#glass)" stroke="#cbd5e1"/>
    </g>
    <text x="76" y="172" class="metricValue">10-18%</text>
    <text x="76" y="196" class="metricLabel">세로 공백 감소 목표</text>
    <text x="342" y="172" class="metricValue">10.3-10.6pt</text>
    <text x="342" y="196" class="metricLabel">권장 본문 크기</text>
    <text x="608" y="172" class="metricValue">1.42-1.50</text>
    <text x="608" y="196" class="metricLabel">한글 PDF 줄간격</text>

    <g filter="url(#softShadow)">
      <rect x="52" y="256" width="1336" height="334" rx="14" fill="#ffffff" fill-opacity="0.64" stroke="#cbd5e1"/>
    </g>
    <text x="82" y="302" class="panelTitle">Light PDF Export</text>
    <text x="82" y="326" class="panelNote">같은 내용의 A4 portrait mockup을 baseline과 compact로 나란히 비교</text>

    <g transform="translate(82 352)">
      <text x="0" y="0" class="label">Current Report Rhythm</text>
      <text x="554" y="0" class="label">Compact Report Rhythm</text>

      <g transform="translate(0 20)" filter="url(#paperShadow)">
        <rect width="520" height="188" rx="6" fill="#ffffff" stroke="#dbe3ee"/>
      </g>
      <g transform="translate(24 48)">
        <rect x="0" y="0" width="116" height="22" rx="11" fill="#f8fafc" stroke="#dbe3ee"/>
        <text x="18" y="15" class="chip">BASELINE</text>
        <text x="0" y="58" class="paperTitle">AI Document Workflow Review</text>
        <text x="0" y="88" class="body">여백이 넉넉해 차분하지만 긴 보고서에서는 페이지 소비가 커진다.</text>
        <rect x="0" y="112" width="462" height="42" rx="7" fill="#ecfdf5" stroke="#bbf7d0"/>
        <text x="18" y="137" class="paperH">Summary</text>
        <line x1="0" y1="174" x2="462" y2="174" stroke="#dbe3ee" stroke-width="2"/>
      </g>

      <g transform="translate(554 20)" filter="url(#paperShadow)">
        <rect width="520" height="188" rx="6" fill="#ffffff" stroke="#dbe3ee"/>
      </g>
      <g transform="translate(578 44)">
        <rect x="0" y="0" width="112" height="20" rx="10" fill="#f8fafc" stroke="#dbe3ee"/>
        <text x="17" y="14" class="chip">COMPACT</text>
        <text x="0" y="48" class="paperTitle" font-size="27">AI Document Workflow Review</text>
        <text x="0" y="75" class="body">제목과 블록 간격을 줄이고 본문 대비를 높여 더 많은 근거를 담는다.</text>
        <rect x="0" y="94" width="462" height="34" rx="7" fill="#ecfdf5" stroke="#99f6e4"/>
        <circle cx="18" cy="111" r="10" fill="#ffffff" stroke="#5eead4"/>
        <text x="15" y="115" fill="#0f766e" font-size="12" font-weight="900">✓</text>
        <text x="38" y="115" class="paperH" font-size="13">Summary: callout padding 축소, 대비 유지</text>
        <g transform="translate(0 143)">
          <rect width="142" height="24" fill="#f8fafc" stroke="#dbe3ee"/>
          <rect x="142" width="190" height="24" fill="#ffffff" stroke="#dbe3ee"/>
          <rect x="332" width="130" height="24" fill="#ffffff" stroke="#dbe3ee"/>
          <text x="10" y="16" class="muted">표 padding 축소</text>
          <text x="154" y="16" class="muted">line-height 조정</text>
          <text x="344" y="16" class="muted">references 압축</text>
        </g>
      </g>
    </g>

    <g filter="url(#softShadow)">
      <rect x="52" y="626" width="1336" height="294" rx="14" fill="url(#darkGlass)" stroke="#334155"/>
    </g>
    <text x="82" y="672" class="panelTitle darkText">Dark Export Preview</text>
    <text x="82" y="696" class="panelNote darkMuted">다크 PDF는 면보다 텍스트 대비와 표 경계를 우선하는 보조 프리셋으로 처리</text>

    <g transform="translate(82 724)">
      <text x="0" y="0" class="label darkLabel">Current Dark Rhythm</text>
      <text x="554" y="0" class="label darkLabel">Compact Dark Rhythm</text>

      <g transform="translate(0 20)" filter="url(#paperShadow)">
        <rect width="520" height="146" rx="6" fill="#111827" stroke="#334155"/>
      </g>
      <g transform="translate(24 46)">
        <rect x="0" y="0" width="108" height="20" rx="10" fill="#182234" stroke="#334155"/>
        <text x="17" y="14" class="chip darkMuted">BASELINE</text>
        <text x="0" y="50" class="paperTitle darkText">Model Capability Notes</text>
        <text x="0" y="78" class="body darkMuted">여백이 넓으면 안정적이지만 근거가 다음 페이지로 밀린다.</text>
        <rect x="0" y="100" width="462" height="28" rx="7" fill="#064e3b" fill-opacity="0.48" stroke="#047857"/>
      </g>

      <g transform="translate(554 20)" filter="url(#paperShadow)">
        <rect width="520" height="146" rx="6" fill="#111827" stroke="#334155"/>
      </g>
      <g transform="translate(578 42)">
        <rect x="0" y="0" width="112" height="20" rx="10" fill="#182234" stroke="#334155"/>
        <text x="17" y="14" class="chip darkMuted">COMPACT</text>
        <text x="0" y="44" class="paperTitle darkText" font-size="27">Model Capability Notes</text>
        <text x="0" y="70" class="body darkText">배경 면을 절제하고 본문과 표의 대비를 높여 첫 페이지 흐름을 안정화한다.</text>
        <rect x="0" y="91" width="462" height="26" rx="7" fill="#0f766e" fill-opacity="0.30" stroke="#22d3ee" stroke-opacity="0.34"/>
        <text x="14" y="108" class="muted darkText">색 대비 우선 · surface 농도 절제 · references 압축</text>
      </g>
    </g>
  </g>
</svg>