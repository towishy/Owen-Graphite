  <circle cx="140" cy="189" r="5" fill="#fbbf24"/>
  <circle cx="158" cy="189" r="5" fill="#34d399"/>
  <text x="184" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Owen Graphite · rollback baseline</text>

