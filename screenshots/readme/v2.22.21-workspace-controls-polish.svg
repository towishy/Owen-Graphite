  <rect x="98" y="208" width="62" height="416" fill="#e5e7eb" fill-opacity="0.52" stroke="#d7dde7"/>
  <g fill="none" stroke="#64748b" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="129" cy="250" r="11"/>
    <path d="M118 314h22M129 303v22"/>
    <path d="M119 382h20l-4 18h-12z"/>
    <rect x="118" y="462" width="22" height="22" rx="6"/>
  </g>
  <rect x="112" y="338" width="34" height="44" rx="17" fill="url(#glassStrong)" stroke="#94a3b8" filter="url(#liftShadow)"/>
  <path d="M120 360h18m-9-9v18" stroke="#475569" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M117 382h24" stroke="#93c5fd" stroke-opacity="0.42" stroke-width="2" stroke-linecap="round"/>

  <!-- File explorer selected path -->
  <rect x="160" y="208" width="250" height="416" fill="#ffffff" fill-opacity="0.62" stroke="#e2e8f0"/>
  <text x="184" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#94a3b8">FILES</text>
