    <text x="194" y="324" font-weight="750" fill="#1f2937">FY26</text>
    <line x1="190" y1="338" x2="190" y2="448" stroke="#64748b" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round"/>
    <circle cx="190" cy="368" r="3.5" fill="#64748b"/>
    <text x="204" y="372" fill="#475569">Board Brief</text>
    <rect x="192" y="390" width="190" height="36" rx="8" fill="url(#glassStrong)" stroke="#cbd5e1" filter="url(#liftShadow)"/>
    <text x="214" y="413" font-weight="750" fill="#0f172a">POSCO - MDA</text>
    <path d="M214 421h126" stroke="#93c5fd" stroke-opacity="0.34" stroke-width="2" stroke-linecap="round"/>
    <circle cx="190" cy="438" r="3.5" fill="#64748b"/>
    <text x="204" y="442" fill="#64748b">MDA Appendix</text>
    <text x="184" y="488" fill="#64748b">Research Notes</text>
    <text x="184" y="524" fill="#64748b">Archive</text>
  </g>

  <!-- Content and graph controls -->
  <rect x="410" y="208" width="692" height="416" fill="#ffffff" fill-opacity="0.54" stroke="#e2e8f0"/>
  <rect x="434" y="232" width="396" height="324" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <g stroke="#94a3b8" stroke-width="1.6" opacity="0.74">
    <line x1="526" y1="364" x2="614" y2="300"/>
    <line x1="614" y1="300" x2="728" y2="380"/>
    <line x1="526" y1="364" x2="662" y2="462"/>
    <line x1="728" y1="380" x2="662" y2="462"/>
  </g>
  <g>
    <circle cx="526" cy="364" r="18" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="614" cy="300" r="22" fill="url(#glassStrong)" stroke="#93c5fd" filter="url(#liftShadow)"/>
    <circle cx="728" cy="380" r="18" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="662" cy="462" r="20" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <rect x="682" y="250" width="114" height="128" rx="16" fill="url(#glassStrong)" stroke="#cbd5e1" filter="url(#liftShadow)"/>
  <text x="706" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Graph</text>
  <rect x="704" y="304" width="70" height="28" rx="14" fill="#ffffff" fill-opacity="0.72" stroke="#cbd5e1"/>
  <text x="723" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">depth</text>
  <rect x="704" y="340" width="70" height="28" rx="14" fill="#ffffff" fill-opacity="0.80" stroke="#93c5fd"/>
  <text x="724" y="359" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="750" fill="#334155">focus</text>

  <!-- Backlinks panel -->
  <rect x="852" y="232" width="218" height="324" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="880" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#0f172a">Backlinks</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="876" y="304" width="166" height="42" rx="10" fill="#ffffff" fill-opacity="0.70" stroke="#e2e8f0"/>
    <text x="894" y="330" font-size="13" fill="#475569">Board Brief</text>
    <rect x="1008" y="315" width="24" height="20" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1016" y="330" font-size="11" fill="#64748b">4</text>
    <rect x="876" y="360" width="166" height="46" rx="12" fill="url(#glassStrong)" stroke="#cbd5e1" filter="url(#liftShadow)"/>
    <text x="894" y="388" font-size="13" font-weight="750" fill="#0f172a">MDA Package</text>
    <rect x="1008" y="373" width="24" height="20" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="1016" y="388" font-size="11" font-weight="750" fill="#334155">8</text>
    <rect x="876" y="422" width="166" height="42" rx="10" fill="#ffffff" fill-opacity="0.70" stroke="#e2e8f0"/>
    <text x="894" y="448" font-size="13" fill="#475569">Release Notes</text>
    <rect x="1008" y="433" width="24" height="20" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1016" y="448" font-size="11" fill="#64748b">2</text>
  </g>

  <rect x="434" y="574" width="636" height="28" rx="14" fill="url(#darkGlass)" filter="url(#liftShadow)"/>
  <text x="460" y="593" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#cbd5e1">Owen Graphite 2.22.21 · stable rollback baseline · theme.css synchronized</text>
