<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">v2.22.21 리퀴드 글래스 베이스빌드 샘플</title>
  <desc id="desc">선택 문서와 포함 폴더, ribbon, graph controls, backlinks rows가 neutral graphite glass 원칙을 따르는 현재 베이스빌드 샘플입니다.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.56" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="24%" cy="16%" r="58%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rimGlow" cx="80%" cy="22%" r="44%">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="glassStrong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f1f5f9" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="darkGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="148%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.13"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="liftShadow" x="-22%" y="-22%" width="144%" height="154%">
      <feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#0f172a" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#page)"/>
  <rect width="1200" height="760" rx="28" fill="url(#topGlow)"/>
  <rect width="1200" height="760" rx="28" fill="url(#rimGlow)"/>

  <text x="72" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">v2.22.21 Liquid Glass Baseline Build</text>
  <text x="74" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">neutral graphite glass at rest, shallow sky rim only on active or hover states</text>

  <rect x="70" y="142" width="1060" height="510" rx="24" fill="url(#glass)" stroke="#d7dde7" filter="url(#softShadow)"/>
  <rect x="98" y="170" width="1004" height="454" rx="18" fill="#f8fafc" fill-opacity="0.72" stroke="#e2e8f0"/>

  <!-- App chrome -->
  <rect x="98" y="170" width="1004" height="38" rx="18" fill="#ffffff" fill-opacity="0.70" stroke="#e2e8f0"/>
