<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="320" viewBox="0 0 2048 320" role="img" aria-labelledby="title desc">
  <title id="title">Workspace chrome connected liquid glass</title>
  <desc id="desc">Owen Graphite v3.1.52 workspace chrome polish based on the real Obsidian layout, with a connected active tab, left navigation, and floating editor toolbar.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#f1f5f9" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="activeTab" x1="0" y1="0" x2="0" y2="1">
