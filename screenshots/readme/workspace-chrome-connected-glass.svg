<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Workspace chrome connected liquid glass</title>
  <desc id="desc">Owen Graphite v3.1.52 workspace chrome polish showing connected active tab, floating editor toolbar, file explorer glass pills, and bottom document frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="softGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="shine" cx="72%" cy="18%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#38bdf8" flood-opacity="0.08"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1120" height="520" fill="url(#bg)"/>
  <rect x="26" y="24" width="1068" height="472" rx="18" fill="#ffffff" fill-opacity="0.72" stroke="#cbd5e1" stroke-opacity="0.62"/>

  <rect x="26" y="24" width="210" height="472" rx="18" fill="url(#softGlass)" stroke="#cbd5e1" stroke-opacity="0.36"/>
  <rect x="236" y="24" width="1" height="472" fill="#94a3b8" opacity="0.22"/>

  <g font-family="Inter, Pretendard, system-ui, sans-serif" font-size="16" font-weight="780" fill="#334155">
    <rect x="52" y="92" width="156" height="34" rx="9" fill="#ffffff" fill-opacity="0.52" stroke="#cbd5e1" stroke-opacity="0.58"/>
    <text x="88" y="114">게임</text>
    <rect x="52" y="138" width="156" height="34" rx="9" fill="#ffffff" fill-opacity="0.52" stroke="#cbd5e1" stroke-opacity="0.58"/>
    <text x="88" y="160">기타</text>
    <rect x="52" y="184" width="156" height="34" rx="9" fill="#ffffff" fill-opacity="0.52" stroke="#cbd5e1" stroke-opacity="0.58"/>
    <text x="88" y="206">임시</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="54" y="438" width="132" height="38" rx="10" fill="url(#glass)" stroke="#7dd3fc" stroke-opacity="0.58"/>
    <text x="90" y="463" font-family="Inter, Pretendard, system-ui, sans-serif" font-size="16" font-weight="760" fill="#111827">Owen-WIKI</text>
  </g>
  <circle cx="206" cy="457" r="18" fill="#ffffff" fill-opacity="0.58" stroke="#cbd5e1"/>
  <circle cx="252" cy="457" r="18" fill="#ffffff" fill-opacity="0.58" stroke="#cbd5e1"/>

  <g>
    <rect x="260" y="42" width="810" height="1" fill="#94a3b8" opacity="0.22"/>
    <rect x="272" y="16" width="166" height="44" rx="18" fill="#ffffff" fill-opacity="0.36" stroke="#cbd5e1" stroke-opacity="0.38"/>
    <text x="292" y="43" font-family="Inter, Pretendard, system-ui, sans-serif" font-size="16" font-weight="700" fill="#64748b">mermaid-live...</text>
    <g filter="url(#shadow)">
      <rect x="456" y="8" width="244" height="54" rx="18" fill="url(#glass)" stroke="#7dd3fc" stroke-opacity="0.62"/>
      <rect x="456" y="58" width="244" height="8" fill="#ffffff" fill-opacity="0.82"/>
      <text x="496" y="42" font-family="Inter, Pretendard, system-ui, sans-serif" font-size="18" font-weight="850" text-anchor="middle" fill="#111827" transform="translate(82 0)">구독 - 요청 - MCAPS</text>
    </g>
    <rect x="718" y="18" width="148" height="36" rx="16" fill="#ffffff" fill-opacity="0.34" stroke="#cbd5e1" stroke-opacity="0.34"/>
    <text x="742" y="42" font-family="Inter, Pretendard, system-ui, sans-serif" font-size="16" font-weight="700" fill="#64748b">Perks +</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="376" y="104" width="520" height="56" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.70"/>
    <g fill="#111827" font-family="Inter, Pretendard, system-ui, sans-serif" font-size="15" font-weight="760">
      <rect x="392" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="403" y="139">↶</text>
      <rect x="436" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="447" y="139">↷</text>
      <rect x="498" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="508" y="139">H2</text>
      <rect x="542" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="552" y="139">H3</text>
      <rect x="586" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="596" y="139">H4</text>
      <rect x="648" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="660" y="139">B</text>
      <rect x="692" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="705" y="139">I</text>
      <rect x="736" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="748" y="139">≡</text>
      <rect x="780" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="791" y="139">▦</text>
      <rect x="824" y="116" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1"/>
      <text x="835" y="139">⌁</text>
    </g>
  </g>

  <text x="300" y="264" font-family="Inter, Pretendard, system-ui, sans-serif" font-size="34" font-weight="850" fill="#111827">구독 - 요청 - MCAPS</text>
  <rect x="300" y="274" width="270" height="2" fill="#67e8f9" opacity="0.60"/>
  <rect x="300" y="310" width="724" height="92" rx="8" fill="#ffffff" fill-opacity="0.50" stroke="#cbd5e1" stroke-opacity="0.54"/>
  <text x="330" y="350" font-family="Inter, Pretendard, system-ui, sans-serif" font-size="17" font-weight="800" fill="#111827">연결된 탭과 문서 프레임</text>
  <text x="330" y="382" font-family="Inter, Pretendard, system-ui, sans-serif" font-size="14" fill="#475569">활성 탭, 하단 문서 제목, vault switcher가 같은 sky-rim glass 언어로 이어집니다.</text>
</svg>
