<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">v2.22.20 리퀴드 글래스 추천 기능 샘플</title>
  <desc id="desc">상태바 구분선, 모달 닫기 버튼, Dataview 인라인 필드 칩, Sync/Git 상태 Pill, 코드블록 행 번호를 한 화면에 보여주는 리퀴드 글래스 샘플입니다.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="18%" cy="18%" r="62%">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="82%" cy="20%" r="52%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#f1f5f9" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="glassStrong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0.54"/>
    </linearGradient>
    <linearGradient id="darkCode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.15"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="liftShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#page)"/>
  <rect width="1200" height="760" rx="28" fill="url(#cyanGlow)"/>
  <rect width="1200" height="760" rx="28" fill="url(#warmGlow)"/>

  <text x="72" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">v2.22.20 Liquid Glass Recommended Polish Pack</text>
  <text x="74" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">상태 표시, 모달 조작, Dataview 정보, 코드 읽기를 같은 glass 언어로 정리한 샘플</text>

  <rect x="68" y="144" width="1064" height="500" rx="22" fill="url(#glass)" stroke="#dbeafe" filter="url(#softShadow)"/>

  <!-- Status bar sample -->
  <rect x="112" y="522" width="976" height="56" rx="28" fill="url(#glassStrong)" stroke="#bae6fd" filter="url(#liftShadow)"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#334155">
    <text x="154" y="557">124 단어</text>
    <text x="296" y="557">3분 읽기</text>
    <text x="454" y="557">Git 정상</text>
    <text x="620" y="557">동기화됨</text>
    <text x="806" y="557">Live Preview</text>
  </g>
  <g stroke-width="1" stroke-linecap="round">
    <line x1="266" y1="537" x2="266" y2="563" stroke="#38bdf8" stroke-opacity="0.46"/>
    <line x1="424" y1="537" x2="424" y2="563" stroke="#38bdf8" stroke-opacity="0.46"/>
    <line x1="590" y1="537" x2="590" y2="563" stroke="#38bdf8" stroke-opacity="0.46"/>
    <line x1="774" y1="537" x2="774" y2="563" stroke="#38bdf8" stroke-opacity="0.46"/>
  </g>
  <rect x="436" y="534" width="118" height="32" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="463" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#075985">Git 정상</text>
  <rect x="604" y="534" width="128" height="32" rx="16" fill="#dcfce7" stroke="#86efac"/>
  <text x="634" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#166534">동기화됨</text>

