  <rect x="116" y="188" width="306" height="210" rx="18" fill="#ffffff" fill-opacity="0.84" stroke="#cbd5e1" filter="url(#liftShadow)"/>
  <text x="146" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">설정 모달</text>
  <rect x="360" y="206" width="38" height="38" rx="19" fill="#fff1f2" stroke="#fb7185"/>
  <path d="M372 218l14 14m0-14l-14 14" stroke="#be123c" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="146" y="266" width="214" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="146" y="318" width="164" height="34" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="146" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#334155">Modal close chrome</text>

  <!-- Dataview inline chips sample -->
  <rect x="466" y="188" width="310" height="210" rx="18" fill="#ffffff" fill-opacity="0.78" stroke="#cbd5e1" filter="url(#softShadow)"/>
  <text x="500" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f172a">Dataview 필드</text>
  <text x="500" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#334155">상태</text>
  <rect x="558" y="259" width="74" height="32" rx="16" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="579" y="281" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#0f766e">담당</text>
  <rect x="640" y="259" width="88" height="32" rx="16" fill="#ffffff" fill-opacity="0.78" stroke="#cbd5e1"/>
  <text x="662" y="281" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Owen</text>
  <rect x="500" y="316" width="72" height="32" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="520" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#1d4ed8">기한</text>
  <rect x="580" y="316" width="124" height="32" rx="16" fill="#ffffff" fill-opacity="0.78" stroke="#cbd5e1"/>
  <text x="598" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">2026-05-10</text>
  <text x="500" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#334155">Inline field chips</text>

  <!-- Code line numbers sample -->
  <rect x="820" y="188" width="268" height="284" rx="18" fill="url(#darkCode)" filter="url(#liftShadow)"/>
  <rect x="1014" y="210" width="42" height="24" rx="7" fill="#334155"/>
  <text x="1027" y="227" font-family="Consolas, monospace" font-size="12" fill="#e2e8f0">JS</text>
  <rect x="1062" y="210" width="44" height="24" rx="7" fill="#f8fafc" fill-opacity="0.92"/>
  <text x="1072" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">복사</text>
  <line x1="875" y1="238" x2="875" y2="420" stroke="#475569" stroke-opacity="0.64"/>
  <g font-family="Consolas, monospace" font-size="15">
    <g fill="#94a3b8"><text x="844" y="266">1</text><text x="844" y="300">2</text><text x="844" y="334">3</text><text x="844" y="368">4</text></g>
    <g fill="#e2e8f0"><text x="896" y="266">const glass = true;</text><text x="896" y="300">if (glass) polish();</text><text x="896" y="334">return validate();</text><text x="896" y="368">// line-numbers</text></g>
  </g>
  <text x="820" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="750" fill="#334155">Opt-in code line numbers</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">
    <text x="112" y="616">Status bar separator · Sync/Git pill</text>
    <text x="820" y="616">Code gutter · no copy overlap</text>
  </g>
</svg>
