<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">B-style PDF confidential footer variants</title>
  <desc id="desc">기존 B안 Header Twin Card와 비슷한 PDF 마지막 페이지 confidential footer 변형 세 가지입니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#e5edf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="7%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.56" stop-color="#f0f9ff" stop-opacity="0.70"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="glassQuiet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="0.62" stop-color="#f8fafc" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="rimCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.86"/>
      <stop offset="0.54" stop-color="#0284c7" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="rimAqua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0369a1" stop-opacity="0.64"/>
      <stop offset="0.52" stop-color="#22d3ee" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.60"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f1f5f9" stop-opacity="0.76"/>
    </linearGradient>
    <filter id="pageShadow" x="-10%" y="-18%" width="120%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="footerShadow" x="-12%" y="-32%" width="124%" height="176%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.07"/>
    </filter>
    <g id="bodyText" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="8.2">
      <text x="0" y="0" fill="currentColor">
        <tspan x="0" dy="0">본 이메일(첨부 파일 포함, 이하 동일)은 Microsoft의 영업비밀을 포함하고 있습니다.</tspan>
        <tspan x="0" dy="11">본 이메일은 합리적으로 보아 귀사 내부에서 알아야 할 필요가 있는 담당자만이 접근할 수 있으며, Microsoft가 동의하지 않는 한 제3자에게 제공, 공유하거나 복제할 수 없습니다.</tspan>
        <tspan x="0" dy="11">본 이메일은 정보제공만을 목적으로 하며, 포함된 모든 정보는 발송 시점의 Microsoft의 견해를 반영한 것입니다. 내용은 변경될 수 있습니다.</tspan>
        <tspan x="0" dy="11">Microsoft는 본 이메일에 포함된 내용에 대하여 명시적, 묵시적 또는 법적인 보증을 하지 않습니다. Microsoft Corporation. All rights reserved.</tspan>
      </text>
    </g>
  </defs>

  <rect width="1200" height="820" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="820" rx="30" fill="url(#glow)"/>
  <text x="70" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="850" fill="#0f172a">B안 계열 Footer 변형 3종</text>
  <text x="70" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Header Twin Card 구조를 유지하면서 밀도, 강조, 실제 PDF 공간 점유만 다르게 조정</text>

  <g transform="translate(70 140)">
    <g filter="url(#pageShadow)">
      <rect width="1060" height="178" rx="18" fill="url(#paper)" stroke="#d7dee8"/>
      <text x="30" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="850" fill="#0f172a">B1. Classic Twin Card</text>
      <text x="30" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b">기존 B안에 가장 가까운 기본형. 라벨과 본문 위계를 또렷하게 유지.</text>
      <rect x="30" y="88" width="420" height="6" rx="3" fill="#eef2f7"/>
      <rect x="30" y="108" width="540" height="6" rx="3" fill="#f1f5f9"/>
      <g filter="url(#footerShadow)">
        <rect x="610" y="38" width="410" height="106" rx="14" fill="url(#glass)" stroke="#bae6fd"/>
        <rect x="624" y="38" width="382" height="3" rx="1.5" fill="url(#rimCool)"/>
        <text x="630" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="7.6" font-weight="800" letter-spacing="1.8" fill="#64748b">DOCUMENT NOTICE</text>
        <text x="630" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="10.4" font-weight="900" letter-spacing="1.15" fill="#0f172a">MICROSOFT CONFIDENTIAL</text>
        <g transform="translate(630 104) scale(0.66)">
          <use href="#bodyText" color="#334155"/>
        </g>
      </g>
    </g>

    <g transform="translate(0 220)" filter="url(#pageShadow)">
      <rect width="1060" height="178" rx="18" fill="url(#paper)" stroke="#d7dee8"/>
      <text x="30" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="850" fill="#0f172a">B2. Compact Twin Card</text>
      <text x="30" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b">하단 여백을 아끼는 실사용형. 본문을 작게 압축하지만 B안의 라벨 구조는 유지.</text>
      <rect x="30" y="88" width="520" height="6" rx="3" fill="#eef2f7"/>
      <rect x="30" y="108" width="460" height="6" rx="3" fill="#f1f5f9"/>
      <g filter="url(#footerShadow)">
        <rect x="610" y="58" width="410" height="82" rx="12" fill="url(#glassQuiet)" stroke="#cbd5e1"/>
        <rect x="622" y="58" width="386" height="2.6" rx="1.3" fill="url(#rimCool)"/>
        <text x="630" y="81" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="800" letter-spacing="1.6" fill="#64748b">FINAL PAGE NOTICE</text>
        <text x="630" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="9.6" font-weight="900" letter-spacing="1.1" fill="#0f172a">MICROSOFT CONFIDENTIAL</text>
        <g transform="translate(630 116) scale(0.58)">
          <use href="#bodyText" color="#475569"/>
        </g>
      </g>
    </g>

    <g transform="translate(0 440)" filter="url(#pageShadow)">
      <rect width="1060" height="178" rx="18" fill="url(#paper)" stroke="#d7dee8"/>
      <text x="30" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="850" fill="#0f172a">B3. Soft Aqua Twin Card</text>
      <text x="30" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b">가장 부드러운 리퀴드 글래스형. 보고서가 차갑게 보이지 않도록 rim 색을 얕게 낮춤.</text>
      <rect x="30" y="88" width="470" height="6" rx="3" fill="#eef2f7"/>
      <rect x="30" y="108" width="510" height="6" rx="3" fill="#f1f5f9"/>
      <g filter="url(#footerShadow)">
        <rect x="610" y="40" width="410" height="104" rx="16" fill="url(#glass)" stroke="#d7eef8"/>
        <rect x="626" y="40" width="378" height="2.8" rx="1.4" fill="url(#rimAqua)"/>
        <rect x="632" y="59" width="122" height="20" rx="10" fill="url(#chip)" stroke="#cbd5e1"/>
        <text x="693" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="850" letter-spacing="1.25" fill="#64748b" text-anchor="middle">NOTICE</text>
        <text x="632" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="900" letter-spacing="1.05" fill="#0f172a">MICROSOFT CONFIDENTIAL</text>
        <g transform="translate(632 116) scale(0.62)">
          <use href="#bodyText" color="#334155"/>
        </g>
      </g>
    </g>
  </g>

  <text x="70" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">추천 기본값: B1. 긴 보고서/본문 공간 우선이면 B2, 조금 더 부드러운 liquid glass 톤이면 B3.</text>
</svg>