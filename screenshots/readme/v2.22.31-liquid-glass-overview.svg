<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Owen Graphite liquid glass overview</title>
  <desc id="desc">Owen Graphite의 최신 liquid glass 작업 화면, 위키형 표, 보고서형 표, Frost Aqua focus halo를 함께 보여주는 README 대표 이미지입니다.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <radialGradient id="pageGlow" cx="24%" cy="10%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="glassActive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.54" stop-color="#e0f2fe" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.70"/>
    </linearGradient>
    <linearGradient id="wikiHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#f1f5f9" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="reportHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="toolGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="toolSkyHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#f0f9ff" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="softShadow" x="-16%" y="-16%" width="132%" height="146%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="liftShadow" x="-20%" y="-24%" width="140%" height="158%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.17"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.10"/>
    </filter>
    <filter id="focusHalo" x="-34%" y="-34%" width="168%" height="168%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#67e8f9" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <filter id="toolShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="toolHoverShadow" x="-24%" y="-24%" width="148%" height="154%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="30" fill="url(#page)"/>
  <rect width="1200" height="760" rx="30" fill="url(#pageGlow)"/>

  <text x="72" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="850" fill="#0f172a">Owen Graphite</text>
  <text x="72" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">리퀴드 글래스 작업공간, 위키형 표, 보고서형 표, 명확한 포커스 상태</text>

  <rect x="70" y="148" width="1060" height="528" rx="26" fill="url(#glass)" stroke="#d7dde7" filter="url(#softShadow)"/>
  <rect x="100" y="176" width="1000" height="472" rx="20" fill="#f8fafc" fill-opacity="0.76" stroke="#e2e8f0"/>

  <rect x="100" y="176" width="1000" height="40" rx="20" fill="#ffffff" fill-opacity="0.72" stroke="#e2e8f0"/>
  <circle cx="126" cy="196" r="5" fill="#fb7185"/>
  <circle cx="146" cy="196" r="5" fill="#fbbf24"/>
  <circle cx="166" cy="196" r="5" fill="#34d399"/>
  <text x="198" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Owen Graphite 2.22.31</text>

  <rect x="100" y="216" width="70" height="432" fill="#ffffff" fill-opacity="0.62" stroke="#dbe3ee"/>
  <g fill="url(#toolGlass)" stroke="#cbd5e1" filter="url(#toolShadow)">
    <rect x="118" y="244" width="34" height="34" rx="12"/>
    <rect x="118" y="294" width="34" height="34" rx="12"/>
    <rect x="118" y="344" width="34" height="34" rx="12"/>
  </g>
  <rect x="116" y="394" width="38" height="38" rx="13" fill="url(#toolSkyHover)" stroke="#93c5fd" filter="url(#toolHoverShadow)"/>
  <g fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="135" cy="261" r="7"/>
    <path d="M128 311h14M135 304v14"/>
    <path d="M127 354h16l-3 14h-10z"/>
    <path d="M127 413h16M135 405v16" stroke="#0f172a"/>
  </g>

  <rect x="170" y="216" width="236" height="432" fill="#ffffff" fill-opacity="0.62" stroke="#e2e8f0"/>
  <text x="196" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="850" fill="#94a3b8">파일</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13">
    <rect x="190" y="278" width="190" height="32" rx="9" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="208" y="299" font-weight="760" fill="#334155">지식 작업</text>
    <rect x="204" y="328" width="176" height="36" rx="10" fill="url(#glassActive)" stroke="#bae6fd" filter="url(#toolHoverShadow)"/>
    <text x="226" y="351" font-weight="820" fill="#0f172a">리퀴드 글래스</text>
    <rect x="204" y="386" width="152" height="30" rx="9" fill="url(#glass)" stroke="#e2e8f0"/>
    <text x="224" y="406" fill="#475569">보고서 샘플</text>
    <rect x="204" y="432" width="134" height="30" rx="9" fill="url(#glass)" stroke="#e2e8f0"/>
    <text x="224" y="452" fill="#64748b">위키 노트</text>
  </g>

  <rect x="406" y="216" width="694" height="432" fill="#ffffff" fill-opacity="0.54" stroke="#e2e8f0"/>

  <g filter="url(#softShadow)">
    <rect x="438" y="248" width="300" height="166" rx="18" fill="url(#glass)" stroke="#cbd5e1"/>
    <text x="462" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" fill="#0f172a">위키형 표</text>
    <text x="462" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">데일리 노트를 위한 부드러운 글래스 표면</text>
    <rect x="462" y="316" width="230" height="80" rx="10" fill="#ffffff" fill-opacity="0.42" stroke="#dbe3ee"/>
    <rect x="474" y="326" width="206" height="20" rx="7" fill="url(#wikiHead)" stroke="#dbe3ee"/>
    <rect x="474" y="351" width="206" height="16" rx="6" fill="#ffffff" fill-opacity="0.54" stroke="#dbe3ee"/>
    <rect x="474" y="373" width="206" height="16" rx="6" fill="#f8fafc" fill-opacity="0.70" stroke="#dbe3ee"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">
      <text x="490" y="340" font-weight="780">항목</text><text x="560" y="340" font-weight="780">상태</text><text x="630" y="340" font-weight="780">메모</text>
      <text x="490" y="364">문서</text><text x="560" y="364">진행</text><text x="630" y="364">연결</text>
      <text x="490" y="386">표현</text><text x="560" y="386">정리</text><text x="630" y="386">얕은 림</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="770" y="248" width="300" height="166" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="794" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="850" fill="#0f172a">보고서형 표</text>
    <text x="794" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">PDF 보고서를 위한 또렷한 정보 위계</text>
    <rect x="794" y="316" width="230" height="80" rx="10" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="806" y="326" width="206" height="20" rx="6" fill="url(#reportHead)" stroke="#dbe3ee"/>
    <rect x="806" y="351" width="206" height="16" rx="5" fill="#ffffff" stroke="#dbe3ee"/>
    <rect x="806" y="373" width="206" height="16" rx="5" fill="#fbfdff" stroke="#dbe3ee"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1f2937">
      <text x="822" y="340" font-weight="820">구분</text><text x="892" y="340" font-weight="820">수치</text><text x="962" y="340" font-weight="820">판단</text>
      <text x="822" y="364" font-weight="720">위험</text><text x="892" y="364">중간</text><text x="962" y="364">관리</text>
      <text x="822" y="386" font-weight="720">완료</text><text x="892" y="386">92%</text><text x="962" y="386">유지</text>
    </g>
  </g>

  <rect x="438" y="452" width="632" height="126" rx="22" fill="url(#glass)" stroke="#cbd5e1" filter="url(#softShadow)"/>
  <text x="466" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="850" fill="#0f172a">프로스트 아쿠아 포커스</text>
  <text x="466" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">선명한 림, 부드러운 후광, 흔들림 없는 배치</text>
  <rect x="838" y="488" width="170" height="46" rx="15" fill="url(#glassActive)" stroke="#67e8f9" filter="url(#focusHalo)"/>
  <text x="872" y="517" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="820" fill="#0f172a">포커스된 컨트롤</text>
  <rect x="524" y="544" width="136" height="22" rx="11" fill="#ffffff" fill-opacity="0.64" stroke="#cbd5e1"/>
  <rect x="682" y="544" width="136" height="22" rx="11" fill="#ffffff" fill-opacity="0.64" stroke="#cbd5e1"/>
  <rect x="840" y="544" width="136" height="22" rx="11" fill="#ffffff" fill-opacity="0.64" stroke="#cbd5e1"/>
  <text x="592" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="760" fill="#64748b" text-anchor="middle">호버</text>
  <text x="750" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="760" fill="#64748b" text-anchor="middle">활성</text>
  <text x="908" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="760" fill="#64748b" text-anchor="middle">포커스</text>

  <rect x="438" y="604" width="632" height="24" rx="12" fill="#0f172a" fill-opacity="0.82"/>
  <text x="466" y="621" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#cbd5e1">기본 상태는 그래파이트/화이트 글래스, 색은 얕은 의미 림이나 후광에만 사용</text>
</svg>
