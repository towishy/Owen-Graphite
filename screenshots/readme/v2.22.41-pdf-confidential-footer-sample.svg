<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PDF last-page confidential footer sample</title>
  <desc id="desc">Owen Graphite PDF export 마지막 페이지 하단에 Microsoft confidential 문구를 헤더 스타일과 유사한 liquid glass footer로 배치한 샘플 이미지입니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#e6edf6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="18%" cy="6%" r="72%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.58" stop-color="#f8fafc" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="footerRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.84"/>
      <stop offset="0.48" stop-color="#0284c7" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#f1f5f9" stop-opacity="0.74"/>
    </linearGradient>
    <filter id="pageShadow" x="-18%" y="-12%" width="136%" height="132%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glassShadow" x="-14%" y="-24%" width="128%" height="158%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="30" fill="url(#bgGlow)"/>

  <text x="74" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="850" fill="#0f172a">PDF 마지막 페이지 Footer 시안</text>
  <text x="74" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">첫 페이지 헤더의 라벨·본문 위계를 유지하되, 하단 confidential notice는 글래스 footer 박스로 고정</text>

  <g filter="url(#pageShadow)">
    <rect x="170" y="142" width="860" height="560" rx="18" fill="url(#page)" stroke="#d7dee8"/>
    <rect x="218" y="190" width="764" height="1" fill="#e5e7eb"/>
    <text x="218" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.8" fill="#94a3b8" font-weight="750">EXPORT PREVIEW · LAST PAGE</text>
    <text x="946" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8" font-weight="700" text-anchor="end">3 / 3</text>

    <text x="218" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="850" fill="#111827">Appendix</text>
    <text x="218" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">본문은 마지막 페이지 하단 notice와 충분한 간격을 두고 끝납니다.</text>

    <rect x="218" y="304" width="328" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="218" y="330" width="690" height="10" rx="5" fill="#eef2f7"/>
    <rect x="218" y="354" width="638" height="10" rx="5" fill="#eef2f7"/>
    <rect x="218" y="378" width="704" height="10" rx="5" fill="#eef2f7"/>
    <rect x="218" y="402" width="572" height="10" rx="5" fill="#eef2f7"/>

    <rect x="218" y="446" width="336" height="76" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="574" y="446" width="336" height="76" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="242" y="477" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="780" fill="#334155">Summary item</text>
    <text x="242" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">PDF content remains readable above the footer.</text>
    <text x="598" y="477" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="780" fill="#334155">Export behavior</text>
    <text x="598" y="502" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Footer appears only on the final printed page.</text>

    <g filter="url(#glassShadow)">
      <rect x="218" y="562" width="764" height="104" rx="14" fill="url(#glass)" stroke="#cbd5e1"/>
      <rect x="232" y="562" width="736" height="3" rx="1.5" fill="url(#footerRim)"/>
      <rect x="238" y="580" width="184" height="24" rx="12" fill="url(#chip)" stroke="#cbd5e1"/>
      <circle cx="256" cy="592" r="4" fill="#0f172a" opacity="0.84"/>
      <text x="270" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="850" letter-spacing="1.3" fill="#0f172a">MICROSOFT CONFIDENTIAL</text>

      <text x="238" y="624" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="10.7" fill="#334155">
        <tspan x="238" dy="0">본 이메일(첨부 파일 포함, 이하 동일)은 Microsoft의 영업비밀을 포함하고 있습니다. 본 이메일은 합리적으로 보아 귀사 내부에서</tspan>
        <tspan x="238" dy="15">알아야 할 필요가 있는 담당자만이 접근할 수 있으며, Microsoft가 동의하지 않는 한 제3자에게 제공, 공유하거나 복제할 수 없습니다.</tspan>
        <tspan x="238" dy="15">본 이메일은 정보제공만을 목적으로 하며, 포함된 모든 정보는 발송 시점의 Microsoft의 견해를 반영한 것입니다. 내용은 변경될 수 있습니다.</tspan>
        <tspan x="238" dy="15">Microsoft는 본 이메일에 포함된 내용에 대하여 명시적, 묵시적 또는 법적인 보증을 하지 않습니다. Microsoft Corporation. All rights reserved.</tspan>
      </text>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="72" y="636" width="74" height="26" rx="13" fill="#ffffff" fill-opacity="0.68" stroke="#cbd5e1"/>
    <text x="109" y="653" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle">Style</text>
    <text x="72" y="690" font-size="12" fill="#64748b">예상 옵션: footer 본문, footer 라벨, footer accent 색상, footer 본문 색상</text>
  </g>
</svg>