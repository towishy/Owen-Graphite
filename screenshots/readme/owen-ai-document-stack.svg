<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="768" viewBox="0 0 1440 768" role="img" aria-labelledby="title desc">
  <title id="title">Owen AI 문서 제작 병합 모델</title>
  <desc id="desc">Owen Graphite, Merged AI Workflow, Owen Editor가 연결되는 Owen AI 문서 제작 흐름도</desc>
  <defs>
    <linearGradient id="header" x1="52" y1="30" x2="1400" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#ecfff7"/>
    </linearGradient>
    <linearGradient id="center" x1="528" y1="199" x2="928" y2="616" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7ea"/>
      <stop offset="1" stop-color="#fffaf3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.11"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .headline { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 36px; font-weight: 800; text-anchor: middle; }
      .subhead { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px; font-weight: 500; text-anchor: middle; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 27px; font-weight: 800; text-anchor: middle; }
      .panel-subtitle { fill: #334155; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 16px; font-weight: 500; text-anchor: middle; }
      .section-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px; font-weight: 800; }
      .body { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 16px; font-weight: 500; }
      .step { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 17px; font-weight: 800; text-anchor: middle; }
      .footer { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="768"/>

  <rect x="51" y="30" width="1349" height="115" rx="24" fill="url(#header)" stroke="#c7d2de"/>
  <text class="headline" x="720" y="78">Owen AI 문서 제작 병합 모델</text>
  <text class="subhead" x="720" y="116">Graphite는 문서 설계 원칙, Editor는 실행 가능한 삽입 문법을 담당한다.</text>

  <g filter="url(#panelShadow)">
    <rect x="74" y="230" width="382" height="358" rx="18" fill="#ffffff" stroke="#214f96" stroke-width="1.3"/>
    <text class="panel-title" x="265" y="277" fill="#1e3a8a">Owen Graphite</text>
    <text class="panel-subtitle" x="265" y="312">Design System Layer</text>
    <line x1="119" y1="345" x2="411" y2="345" stroke="#dce7ee" stroke-width="3"/>
    <text class="section-title" x="122" y="386">정의하는 것</text>
    <text class="body" x="122" y="424">• 문서 구조와 정보 계층</text>
    <text class="body" x="122" y="459">• 보고서/PDF 출력 안정성</text>
    <text class="body" x="122" y="494">• Callout 의미 체계</text>
    <text class="body" x="122" y="529">• Table utility class</text>
  </g>

  <polygon points="455,390 490,390 490,372 523,408 490,444 490,426 455,426" fill="#40516a"/>
  <polygon points="994,390 959,390 959,372 926,408 959,444 959,426 994,426" fill="#40516a"/>

  <g filter="url(#softShadow)">
    <rect x="525" y="200" width="400" height="418" rx="24" fill="url(#center)" stroke="#dd8c56" stroke-width="1.3"/>
    <text class="panel-title" x="725" y="249" fill="#7c2d12">Merged AI Workflow</text>
    <text class="panel-subtitle" x="725" y="286" fill="#7c2d12">LLM-wiki 문서 생성 기본값</text>
    <rect x="574" y="330" width="302" height="53" rx="10" fill="#ffffff" stroke="#ead9b7"/>
    <text class="step" x="725" y="363">1. 목적과 독자 정의</text>
    <rect x="574" y="401" width="302" height="53" rx="10" fill="#ffffff" stroke="#ead9b7"/>
    <text class="step" x="725" y="434">2. Graphite 구조 선택</text>
    <rect x="574" y="473" width="302" height="53" rx="10" fill="#ffffff" stroke="#ead9b7"/>
    <text class="step" x="725" y="506">3. Editor 문법 적용</text>
    <rect x="574" y="545" width="302" height="53" rx="10" fill="#ffffff" stroke="#ead9b7"/>
    <text class="step" x="725" y="578">4. 출력 품질 검증</text>
  </g>

  <g filter="url(#panelShadow)">
    <rect x="996" y="230" width="382" height="358" rx="18" fill="#ffffff" stroke="#10a779" stroke-width="1.3"/>
    <text class="panel-title" x="1187" y="277" fill="#047857">Owen Editor</text>
    <text class="panel-subtitle" x="1187" y="312">Implementation Layer</text>
    <line x1="1041" y1="345" x2="1333" y2="345" stroke="#dbf5e9" stroke-width="3"/>
    <text class="section-title" x="1044" y="386">구현하는 것</text>
    <text class="body" x="1044" y="424">• 버튼 결과 Markdown/HTML</text>
    <text class="body" x="1044" y="459">• Table Builder preset</text>
    <text class="body" x="1044" y="494">• Metric/status/reference snippet</text>
    <text class="body" x="1044" y="529">• Command ID와 변환 규칙</text>
  </g>

  <rect x="155" y="671" width="1140" height="68" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="footer" x="725" y="713">최종 원칙: Markdown-first, purpose-specific classes, summary-first judgement, source-backed actions.</text>

  <rect x="0.5" y="0.5" width="1439" height="767" rx="0" fill="none" stroke="#cbd5e1" stroke-width="1" pointer-events="none"/>
  </svg>