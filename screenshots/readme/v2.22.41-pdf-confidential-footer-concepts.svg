<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">PDF confidential footer concept board</title>
  <desc id="desc">Owen Graphite PDF 마지막 페이지 footer를 위한 네 가지 liquid glass 추천 시안입니다.</desc>
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.56" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#e5edf6"/>
    </linearGradient>
    <radialGradient id="pageGlow" cx="20%" cy="8%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.58" stop-color="#f8fafc" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#e2e8f0" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="skyGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.55" stop-color="#f0f9ff" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0.44"/>
    </linearGradient>
    <linearGradient id="monoGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
    <linearGradient id="rimCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a" stop-opacity="0.84"/>
      <stop offset="0.52" stop-color="#0284c7" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="rimGraphite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111827" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#64748b" stop-opacity="0.62"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-14%" width="124%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <filter id="footerShadow" x="-16%" y="-30%" width="132%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.06"/>
    </filter>
    <g id="noticeLines" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" font-size="5.85">
      <text x="0" y="0" fill="currentColor">
        <tspan x="0" dy="0">본 이메일(첨부 파일 포함, 이하 동일)은 Microsoft의 영업비밀을 포함하고 있습니다.</tspan>
        <tspan x="0" dy="8">본 이메일은 합리적으로 보아 귀사 내부에서 알아야 할 필요가 있는 담당자만이 접근할 수 있으며,</tspan>
        <tspan x="0" dy="8">Microsoft가 동의하지 않는 한 제3자에게 제공, 공유하거나 복제할 수 없습니다.</tspan>
        <tspan x="0" dy="8">본 이메일은 정보제공만을 목적으로 하며, 발송 시점의 Microsoft의 견해를 반영한 것입니다.</tspan>
        <tspan x="0" dy="8">본 이메일에 포함된 내용은 변경될 수 있습니다. Microsoft는 명시적, 묵시적 또는 법적인 보증을 하지 않습니다.</tspan>
        <tspan x="0" dy="8">Microsoft Corporation. All rights reserved.</tspan>
      </text>
    </g>
  </defs>

  <rect width="1200" height="900" rx="30" fill="url(#boardBg)"/>
  <rect width="1200" height="900" rx="30" fill="url(#pageGlow)"/>
  <text x="64" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="850" fill="#0f172a">PDF 마지막장 Footer 추천 시안</text>
  <text x="64" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Style Settings 입력값으로 바꿀 수 있는 confidential footer 디자인 후보 4종</text>

  <g transform="translate(64 142)">
    <g filter="url(#shadow)">
      <rect width="510" height="286" rx="18" fill="url(#paper)" stroke="#d7dee8"/>
      <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="850" fill="#0f172a">A. Quiet Legal Strip</text>
      <text x="28" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">가장 무난한 법무/제안서형. 얇은 glass strip과 상단 rim만 사용.</text>
      <rect x="28" y="88" width="270" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="28" y="111" width="420" height="6" rx="3" fill="#eef2f7"/>
      <rect x="28" y="130" width="364" height="6" rx="3" fill="#eef2f7"/>
      <g filter="url(#footerShadow)">
        <rect x="28" y="178" width="454" height="74" rx="11" fill="url(#glass)" stroke="#cbd5e1"/>
        <rect x="39" y="178" width="432" height="2.4" rx="1.2" fill="url(#rimGraphite)"/>
        <text x="44" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="8.4" font-weight="850" letter-spacing="1.2" fill="#111827">MICROSOFT CONFIDENTIAL</text>
        <use href="#noticeLines" transform="translate(44 218)" color="#334155"/>
      </g>
    </g>

    <g transform="translate(562 0)" filter="url(#shadow)">
      <rect width="510" height="286" rx="18" fill="url(#paper)" stroke="#d7dee8"/>
      <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="850" fill="#0f172a">B. Header Twin Card</text>
      <text x="28" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">첫 페이지 헤더의 두 줄 구조를 footer 카드로 확장. 가장 일관적인 선택.</text>
      <rect x="28" y="88" width="420" height="6" rx="3" fill="#eef2f7"/>
      <rect x="28" y="109" width="362" height="6" rx="3" fill="#eef2f7"/>
      <g filter="url(#footerShadow)">
        <rect x="28" y="160" width="454" height="92" rx="13" fill="url(#skyGlass)" stroke="#bae6fd"/>
        <rect x="41" y="160" width="428" height="2.8" rx="1.4" fill="url(#rimCool)"/>
        <text x="44" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="7.2" font-weight="800" letter-spacing="1.6" fill="#64748b">DOCUMENT NOTICE</text>
        <text x="44" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="900" letter-spacing="1.1" fill="#0f172a">MICROSOFT CONFIDENTIAL</text>
        <use href="#noticeLines" transform="translate(44 220)" color="#334155"/>
      </g>
    </g>

    <g transform="translate(0 338)" filter="url(#shadow)">
      <rect width="510" height="286" rx="18" fill="url(#paper)" stroke="#d7dee8"/>
      <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="850" fill="#0f172a">C. Compact Micro Footer</text>
      <text x="28" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">본문 공간을 가장 적게 차지하는 압축형. 긴 보고서에 안전.</text>
      <rect x="28" y="88" width="440" height="6" rx="3" fill="#eef2f7"/>
      <rect x="28" y="109" width="388" height="6" rx="3" fill="#eef2f7"/>
      <rect x="28" y="130" width="330" height="6" rx="3" fill="#eef2f7"/>
      <g filter="url(#footerShadow)">
        <rect x="28" y="190" width="454" height="60" rx="10" fill="url(#monoGlass)" stroke="#cbd5e1"/>
        <rect x="38" y="190" width="434" height="2" rx="1" fill="#334155" opacity="0.82"/>
        <text x="44" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="900" letter-spacing="1.1" fill="#111827">MICROSOFT CONFIDENTIAL</text>
        <g transform="translate(44 226) scale(0.82)">
          <use href="#noticeLines" color="#475569"/>
        </g>
      </g>
    </g>

    <g transform="translate(562 338)" filter="url(#shadow)">
      <rect width="510" height="286" rx="18" fill="url(#paper)" stroke="#d7dee8"/>
      <text x="28" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="850" fill="#0f172a">D. Executive Seal Footer</text>
      <text x="28" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">라벨을 badge로 분리해 존재감을 높인 임원 보고서형.</text>
      <rect x="28" y="88" width="270" height="7" rx="3.5" fill="#e2e8f0"/>
      <rect x="28" y="111" width="420" height="6" rx="3" fill="#eef2f7"/>
      <rect x="28" y="130" width="364" height="6" rx="3" fill="#eef2f7"/>
      <g filter="url(#footerShadow)">
        <rect x="28" y="168" width="454" height="84" rx="14" fill="url(#glass)" stroke="#cbd5e1"/>
        <rect x="44" y="187" width="84" height="42" rx="11" fill="#0f172a" fill-opacity="0.90"/>
        <text x="86" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="7.4" font-weight="900" letter-spacing="1.1" fill="#ffffff" text-anchor="middle">MICROSOFT</text>
        <text x="86" y="221" font-family="Segoe UI, Arial, sans-serif" font-size="6.6" font-weight="800" letter-spacing="1.1" fill="#cbd5e1" text-anchor="middle">CONFIDENTIAL</text>
        <rect x="148" y="187" width="318" height="2.5" rx="1.25" fill="url(#rimCool)"/>
        <g transform="translate(148 207) scale(0.78)">
          <use href="#noticeLines" color="#334155"/>
        </g>
      </g>
    </g>
  </g>

  <text x="64" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">추천: B는 기존 첫 페이지 헤더와 가장 잘 맞고, C는 실제 PDF 본문 공간을 가장 덜 먹습니다.</text>
</svg>
